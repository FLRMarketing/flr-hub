  font:600 13px/1 var(--font-text);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background-color .15s,color .15s,transform .28s var(--ease)}
.fchip input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.fchip .ico{display:none;width:14px;height:14px;margin-left:-3px}
.fchip:has(input:checked){background:var(--tint-fill);color:var(--on-tint)}
.fchip:has(input:checked) .ico{display:block}
.fchip:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.fchip:active{transform:scale(.95);transition-duration:.08s}
@media (hover:hover){.fchip:not(:has(input:checked)):hover{background:var(--fill-2)}}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){
  .toolbar .grow{flex-basis:100%}
  .toolbar select.input{flex:1 1 150px}
}

/* ---------------------------------------------------------------- alerts, empty states, loading */
.alerts{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.alerts:empty{display:none}
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);font-size:14px;line-height:1.45}
.alert::before{content:"!";flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;background:var(--gold);color:#1b1200;font:700 13px/1 var(--font-text)}
.alert.bad::before{background:var(--red);color:#fff}
.alert .at{display:flex;flex-direction:column;gap:2px;min-width:0}
.alert b{font-weight:600}
.alert .muted{color:var(--ink-3)}
.wp-issues{display:grid;gap:8px;margin:6px 0 4px;padding:0;list-style:none}
.wp-issues li{display:grid;gap:1px}
.wp-issues b{font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:44px 20px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);text-align:center;color:var(--ink-2)}
.empty h3{font:600 17px/1.3 var(--font-text);letter-spacing:-.016em;color:var(--ink)}
.empty p{max-width:46ch;font-size:14.5px}
.em-ico{display:grid;place-items:center;width:52px;height:52px;margin-bottom:6px;border-radius:50%;background:var(--fill);color:var(--ink-2)}
.em-ico .ico{width:26px;height:26px}
.em-ico.ok{background:var(--green-soft);color:var(--green-ink)}
.skeleton{display:grid;gap:16px}
.skeleton div{height:200px;border-radius:var(--r-card);background:var(--skeleton)}
.skeleton div+div{height:140px}
@media (prefers-reduced-motion:no-preference){
  .skeleton div{background:linear-gradient(90deg,var(--skeleton) 30%,var(--skeleton-hi) 50%,var(--skeleton) 70%) 0 0/300% 100%;animation:shimmer 1.4s linear infinite}
}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* ---------------------------------------------------------------- status pills (filled) and suggestions (outlined) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font:600 12.5px/1.35 var(--font-text);letter-spacing:-.003em;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:currentColor}
.pill.ok{background:var(--green-soft);color:var(--green-ink)}
.pill.new{background:var(--tint-soft);color:var(--tint)}
.pill.review{background:var(--gold-soft);color:var(--gold-ink)}
.pill.deny{background:var(--red-soft);color:var(--red-ink)}
.pill.grey{background:var(--fill);color:var(--ink-2)}
.pill.grey::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.pill.sug{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--fill);font:500 12.5px/1.4 var(--font-text);color:var(--ink-2);white-space:nowrap}
.chip.days{background:var(--tint-soft);color:var(--tint);font-weight:600}

/* ---------------------------------------------------------------- approvals */
.cards{display:grid;gap:18px}
.card{min-width:0;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);overflow:hidden}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:16px 18px}
.ch-who{display:flex;align-items:center;gap:12px;min-width:0}
.ch-who>div{min-width:0}
.ch-side{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.avatar{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:50%;background:var(--tint-soft);color:var(--tint);font:600 15px/1 var(--font-text);letter-spacing:.02em}
img.avatar{display:block;object-fit:cover;background:var(--fill);box-shadow:0 0 0 var(--hair) var(--sep)}   /* the person's photo, when there is one */
.card-head h2{font:600 19px/1.25 var(--font-display);letter-spacing:-.017em;overflow-wrap:anywhere}
.meta-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:5px;font-size:13px;color:var(--ink-2)}
.card-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-top:var(--hair) solid var(--sep)}
.card-col{display:grid;align-content:start;gap:18px;min-width:0;padding:16px 18px 18px}
.card-col.side{background:var(--surface-2);border-left:var(--hair) solid var(--sep)}
@media (max-width:860px){.card-body{grid-template-columns:minmax(0,1fr)}.card-col.side{border-left:0;border-top:var(--hair) solid var(--sep)}}
.card-foot{display:grid;gap:12px;padding:16px 18px 18px;border-top:var(--hair) solid var(--sep)}
.panel-block{display:grid;gap:8px;min-width:0}
.panel-title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font:600 13px/1.3 var(--font-text);letter-spacing:-.003em;color:var(--ink-2)}
.dates{font:600 20px/1.25 var(--font-display);letter-spacing:-.018em;font-variant-numeric:tabular-nums;text-wrap:balance}
.subtle{font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.subtle.neg{color:var(--red-ink);font-weight:600}
.note-text{padding:10px 12px;border-radius:10px;background:var(--fill);font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.formlink{font-weight:600;color:var(--ink);overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.statlist{border-radius:12px;background:var(--surface);box-shadow:0 0 0 var(--hair) var(--sep);overflow:hidden}
.card-col.side .statlist{box-shadow:var(--sh-card)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 12px;font-size:14px}
.stat+.stat{background:linear-gradient(var(--sep),var(--sep)) 12px 0/calc(100% - 12px) var(--hair) no-repeat}
.stat>span{color:var(--ink-2)}
.stat b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
button.stat{align-items:center;width:100%;border:0;background-color:transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background-color .15s}
button.stat b{display:inline-flex;align-items:center;gap:2px;color:var(--tint)}
button.stat b .ico{width:15px;height:15px;margin-right:-4px}
@media (hover:hover){button.stat:hover{background-color:var(--row-hover)}}
button.stat:active{background-color:var(--fill);transition-duration:.08s}
button.stat:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.left-after{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px 12px;border-top:var(--hair) solid var(--sep)}
.left-after>span:first-child{font:600 14px/1.3 var(--font-text)}
.left-after .big{font:700 32px/1 var(--font-num);letter-spacing:-.02em}
.big.neg{color:var(--red-ink)}
.yearlabel{margin-top:2px;font:600 13px/1.3 var(--font-text);color:var(--ink-3)}
.greyline{padding:10px 12px;border-radius:10px;background:var(--fill);font-size:13.5px;color:var(--ink-2)}
.okline{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--green-soft);color:var(--green-ink);font-size:13.5px;font-weight:600}
.okline .ico{width:16px;height:16px}
.groupblock{display:grid;gap:8px}
.gb-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;font-size:14px}
.gb-head b{font-weight:600}
.clash-list{display:grid;gap:6px;padding:0;list-style:none}
.clash-list li{padding:8px 12px;border-radius:10px;background:var(--red-soft);font-size:13.5px;line-height:1.45}
.clash-list li b{color:var(--red-ink);font-weight:600}
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.decide-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
@media (max-width:560px){.decide-row .btn{flex:1 1 0;padding-inline:10px}}

/* ---------------------------------------------------------------- planner grid: the diary, and the few days around each request */
.grid-wrap{overflow-x:auto;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);overscroll-behavior-x:contain}
.card .grid-wrap{border-radius:12px;box-shadow:none;border:var(--hair) solid var(--sep)}
table.plan{min-width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.plan th,table.plan td{padding:0;text-align:center;border-bottom:var(--hair) solid var(--sep);border-right:var(--hair) solid var(--sep)}
table.plan tr>:last-child{border-right:0}
table.plan tbody tr:last-child>*{border-bottom:0}
table.plan .name{position:sticky;left:0;z-index:2;min-width:168px;max-width:220px;padding:7px 12px;background-color:var(--surface);text-align:left;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:var(--hair) solid var(--line-2)}
table.plan .name .pn{display:flex;align-items:center;gap:7px;min-width:0}
/* each name is a button to that person's record, filling its cell */
table.plan button.pn{width:calc(100% + 24px);margin:-7px -12px;padding:7px 12px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background-color .15s}
@media (hover:hover){table.plan button.pn:hover{background:var(--row-hover)}table.plan button.pn:hover .pt{color:var(--tint)}}
table.plan button.pn:active{background:var(--fill);transition-duration:.08s}
table.plan button.pn:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
table.plan .name .pn .av{--av:20px;margin-block:-1px}   /* a 20px photo; rows keep their height */
table.plan .name .pt{min-width:0;overflow:hidden;text-overflow:ellipsis}
table.plan .name .ws{display:none}
table.plan thead th{position:sticky;top:0;z-index:3;background-color:var(--surface)}
table.plan thead th.weekend{background-color:var(--weekend)}
table.plan thead th.name{z-index:4;font:600 12px/1.3 var(--font-text);color:var(--ink-3)}
table.plan .dh{min-width:31px;padding:6px 0 7px;font:600 12.5px/1 var(--font-text);font-variant-numeric:tabular-nums;color:var(--ink)}
table.plan .dh .dow{display:block;margin-bottom:4px;font-size:10px;font-weight:600;color:var(--ink-3)}
table.plan .dh .dn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px}
table.plan .dh.today .dn{background:var(--tint-fill);color:var(--on-tint)}
table.plan .dh.inreq{box-shadow:inset 0 -3px 0 var(--tint)}
table.plan td.day{position:relative;height:30px;min-width:31px}
.weekend{background-color:var(--weekend)}
.closed-bh{--cl:var(--bh);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bh) 42%,transparent) 0 1.5px,transparent 1.5px 6px)}
.closed-shut{--cl:var(--shut);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--shut) 48%,transparent) 0 1.5px,transparent 1.5px 6px)}
.closed-jeff{--cl:var(--jeff);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--jeff) 48%,transparent) 0 1.5px,transparent 1.5px 6px)}
.fill{position:absolute;top:5px;bottom:5px;left:2px;width:calc(100% - 4px);display:block;padding:0;border:0;border-radius:var(--r-cell)}
.fill.half-am{width:calc(50% - 3px)}
.fill.half-pm{left:auto;right:2px;width:calc(50% - 3px)}
button.fill{cursor:pointer;transition:transform .2s var(--ease),filter .15s}
button.fill:active{transform:scale(.86);transition-duration:.08s}
@media (hover:hover){button.fill:hover{filter:brightness(1.12) saturate(1.1)}}
button.fill:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.fill.accepted{background:var(--ok)}
.fill.new{background:repeating-linear-gradient(135deg,var(--tint-fill) 0 3px,color-mix(in srgb,var(--tint-fill) 32%,var(--surface)) 3px 6px)}
.fill.review{background:repeating-linear-gradient(135deg,var(--gold) 0 3px,color-mix(in srgb,var(--gold) 38%,var(--surface)) 3px 6px)}
tr.section th{padding:9px 0;background-color:var(--surface-2);text-align:left}
.sec-t{position:sticky;left:0;display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding-inline:12px;font:600 13px/1.3 var(--font-text);color:var(--ink)}
.sec-t .limit{font-weight:400;color:var(--ink-3)}
tr.count td{height:24px;font:600 11.5px/1 var(--font-text);font-variant-numeric:tabular-nums;color:var(--ink-3)}
tr.count td.over{background-color:var(--red-soft);color:var(--red-ink);font-weight:700}
tr.count .name{font:500 12px/1.3 var(--font-text);color:var(--ink-3)}
@media (max-width:640px){table.plan .name{min-width:116px;max-width:140px;padding-inline:10px;font-size:12.5px}table.plan .name .wf{display:none}table.plan .name .ws{display:inline}}
/* The colour key pulls down from its button at the end of the filters, anchored to it, and is out of the way otherwise */
.diary-filters{position:relative}
.keydrop{position:relative;flex:none;margin-left:auto}
.keydrop>summary{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 11px 0 13px;border-radius:999px;background:var(--fill);color:var(--ink);
  font:600 13px/1 var(--font-text);list-style:none;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background-color .15s,transform .28s var(--ease)}
.keydrop>summary::-webkit-details-marker{display:none}
.keydrop>summary:active{transform:scale(.95);transition-duration:.08s}
.keydrop>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (hover:hover){.keydrop>summary:hover{background:var(--fill-2)}}
.keydrop[open]:not(.closing)>summary{background:var(--fill-2)}
.kb-dots{display:inline-flex;gap:2px}
.kb-dots i{width:8px;height:8px;border-radius:50%}
.kb-chev{width:14px;height:14px;color:var(--ink-3);transition:transform .32s var(--ease)}
.keydrop[open]:not(.closing) .kb-chev{transform:rotate(180deg)}
.key-pop{position:absolute;z-index:30;top:calc(100% + 8px);right:0;display:grid;grid-template-columns:repeat(3,max-content);gap:16px 30px;
  width:max-content;max-width:calc(100vw - 2 * var(--gutter));padding:16px 20px 18px;border-radius:16px;
  background:var(--mat-alert);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--sh-float)}
.key-sec{display:grid;align-content:start;gap:9px;min-width:0}
.key-sec .kh{margin:0;font:600 12.5px/1.3 var(--font-text);color:var(--ink-3)}
.key-sec ul{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.key-sec li{display:flex;align-items:center;gap:9px;font:500 13.5px/1.3 var(--font-text);color:var(--ink);white-space:nowrap}
.key-sec .sw{width:20px;height:14px}
@media (max-width:760px){.key-pop{grid-template-columns:repeat(2,max-content)}.key-sec.other{grid-column:1 / -1}.key-sec.other ul{grid-template-columns:repeat(2,max-content);column-gap:30px}}
@media (max-width:560px){
  .keydrop{position:static;margin-left:0}   /* the button lines up with the chips, and the panel spans the filters below them */
  .key-pop{left:0;right:0;width:auto;max-width:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .key-sec.other ul{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
  .key-sec li{white-space:normal}
}
/* Once the Colour key button scrolls up under the navigation bar on the Diary, the bar takes over: a compact key
   button, and, while the key is open, the key itself as a slim strip along the bottom of the bar. It comes along as
   the page scrolls, the page scrolls beneath it as it does beneath the bar, and it never sits over the grid itself. */
.nb-key{display:none}
html.key-docked .nb-key{display:grid}
.nb-key .kb-dots{gap:2.5px}
.nb-key .kb-dots i{width:7px;height:7px}
.nb-key[aria-expanded="true"]{background:var(--tint-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 45%,transparent)}
@media (prefers-reduced-motion:no-preference){html.key-docked .nb-key{animation:nbkey-in .34s cubic-bezier(.2,1,.4,1)}}
@keyframes nbkey-in{from{opacity:0;transform:scale(.6)}}
.key-strip{position:relative;display:flex;align-items:flex-start;gap:12px;max-width:1296px;margin:0 auto;
  padding:2px max(var(--gutter),env(safe-area-inset-right,0px)) 10px max(var(--gutter),env(safe-area-inset-left,0px))}
.ks-scroll{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;flex:1 1 auto;min-width:0;padding-top:4px}
.ks-group{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px}
.ks-group .kh{font:600 11.5px/1.3 var(--font-text);letter-spacing:.01em;color:var(--ink-3)}
.ks-item{display:inline-flex;align-items:center;gap:6px;font:500 13px/1.3 var(--font-text);color:var(--ink);white-space:nowrap}
.ks-item .sw{width:18px;height:13px}
.ks-close{width:28px;height:28px}
@media (prefers-reduced-motion:no-preference){.key-strip.arrive{animation:strip-in .3s cubic-bezier(.2,1,.4,1)}}
@keyframes strip-in{from{opacity:0;transform:translateY(-6px)}}
@media (max-width:760px){   /* phones: one line that swipes sideways, so the strip stays slim */
  .key-strip{align-items:center;padding-bottom:8px}
  .ks-scroll{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 20px 2px 0;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .ks-scroll::-webkit-scrollbar{display:none}
  .ks-group{flex-wrap:nowrap;flex:none}
}
.sw{position:relative;display:inline-block;flex:none;width:16px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 var(--hair) var(--line-2)}
.sw.acc{background:var(--ok);box-shadow:none}
.sw.new{background:repeating-linear-gradient(135deg,var(--tint-fill) 0 3px,color-mix(in srgb,var(--tint-fill) 32%,var(--surface)) 3px 6px);box-shadow:none}
.sw.rev{background:repeating-linear-gradient(135deg,var(--gold) 0 3px,color-mix(in srgb,var(--gold) 38%,var(--surface)) 3px 6px);box-shadow:none}
.foot{margin:12px 4px 0;max-width:90ch;font-size:12.5px;line-height:1.5;color:var(--ink-3)}

/* ---------------------------------------------------------------- diary: month navigation, calendar, and an agenda on phones */
.diary-nav{justify-content:space-between;margin-bottom:12px}
.monthnav{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0}
.month{min-width:190px;font:700 22px/1.2 var(--font-display);letter-spacing:-.016em;text-align:center;font-variant-numeric:tabular-nums}
.monthnav .btn{margin-left:4px}
@media (max-width:560px){.month{min-width:0;flex:1 1 auto;font-size:19px}.diary-nav .seg{flex:1 1 100%}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--hair);border-radius:var(--r-card);background:var(--sep);box-shadow:var(--sh-card);overflow:hidden}
.cal .dow{padding:8px 10px;background:var(--surface-2);font:600 12px/1.2 var(--font-text);color:var(--ink-3)}
.cal .cell{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:112px;padding:6px 6px 8px;background-color:var(--surface)}
.cal .cell.out{background-color:var(--surface-2)}
.cal .cell.we{background-color:var(--weekend)}
.cal .d{display:inline-grid;place-items:center;align-self:flex-start;min-width:26px;height:26px;padding:0 4px;border-radius:13px;font:600 13px/1 var(--font-text);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cal .cell.today .d{background:var(--tint-fill);color:var(--on-tint)}
/* A holiday's name and day number sit on solid plates tinted with the holiday's colour, so they read clearly over its stripes */
.cal .cell:is(.closed-bh,.closed-shut,.closed-jeff):not(.today) .d{background:var(--surface);color:var(--ink);
  box-shadow:0 0 0 var(--hair) color-mix(in srgb,var(--cl) 55%,transparent)}
.cal .closure{align-self:stretch;margin-top:1px;padding:4px 7px 4px 9px;border-radius:7px;background:color-mix(in srgb,var(--cl,var(--bh)) 14%,var(--surface));
  box-shadow:inset 3px 0 0 var(--cl,var(--bh)),0 0 0 var(--hair) color-mix(in srgb,var(--cl,var(--bh)) 32%,transparent);
  font:600 12px/1.32 var(--font-text);letter-spacing:-.004em;color:var(--ink);overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:5px;width:100%;min-width:0;padding:2px 7px 2px 2px;border:0;border-radius:999px;background:none;font:500 12px/1.35 var(--font-text);color:var(--ink);text-align:left;white-space:nowrap}
.who .wn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.who.accepted{background:var(--green-soft)}
.who.pending{padding:1px 6px 1px 1px;border:1px dashed color-mix(in srgb,var(--tint) 60%,transparent);background:var(--tint-soft)}
.who .av{--av:18px;margin-block:-1px}   /* an 18px photo in the 20px entry: entries keep their height */
/* Narrower day cells (tablets) shorten the name so the photo doesn't squeeze it: "Richard W.", then "Richard".
   Phones get the day list instead, with whole names. */
.cal .cell{container-type:inline-size}
.who .ws,.who .wt{display:none}
@container (max-width:150px){.who .wf{display:none}.who .ws{display:inline}}
@container (max-width:112px){.who .ws{display:none}.who .wt{display:inline}}
/* Staff photos: a small circle beside each name, or the person's initials in the same circle. The ring is the
   page's surface, or the colour of the leave type for other leave. */
.av{flex:none;display:inline-grid;place-items:center;width:var(--av,20px);height:var(--av,20px);border-radius:50%;overflow:hidden;
  background:linear-gradient(180deg,var(--av-a),var(--av-b));color:#fff;font:600 calc(var(--av,20px) * .44)/1 var(--font-text);letter-spacing:.02em;
  box-shadow:0 0 0 1.5px var(--ring,var(--surface));user-select:none;-webkit-user-select:none}
img.av{display:block;object-fit:cover;background:var(--fill)}
button.who{cursor:pointer;transition:transform .2s var(--ease),filter .15s}
button.who:active{transform:scale(.96);transition-duration:.08s}
@media (hover:hover){button.who:hover{filter:brightness(.97)}}
.agenda{display:none}
@media (max-width:640px){.cal{display:none}.agenda{display:block}}
.ag-list{padding:0;list-style:none;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);overflow:hidden}
.ag-day{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:start;gap:12px;padding:11px 14px}
.ag-day+.ag-day{box-shadow:inset 0 var(--hair) 0 var(--sep)}
.ag-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;background:var(--fill);line-height:1}
.ag-date b{font:700 19px/1 var(--font-num);font-variant-numeric:tabular-nums}
.ag-date small{margin-top:3px;font:600 10.5px/1 var(--font-text);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.ag-day.today .ag-date{background:var(--tint-fill);color:var(--on-tint)}
.ag-day.today .ag-date small{color:inherit;opacity:.85}
.ag-main{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;padding-top:3px}
.ag-main .who{width:auto;max-width:100%;padding:5px 11px 5px 4px;border-radius:999px;font-size:13px}
.ag-main .who.pending{padding:4px 10px 4px 3px}
.ag-main .who .av{--av:20px;margin-block:-1.5px}   /* 20px on phones, in a chip of the same height as before */
.ag-closure{display:flex;align-items:center;gap:8px;flex-basis:100%;font:600 13.5px/1.3 var(--font-text);color:var(--ink)}

/* ---------------------------------------------------------------- leave list: each person's leave for the year, in date order */
.lv{display:grid;gap:22px}
.lv-sec{display:grid;gap:8px;min-width:0}
.lv-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding-inline:18px;font:600 13px/1.3 var(--font-text);color:var(--ink-2)}
.lv-head .limit{font-weight:400;color:var(--ink-3)}
.lv-card{padding:0;margin:0;list-style:none;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);overflow:hidden}
.lv-person{display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr);gap:4px 16px;padding:8px 10px 8px 18px}
.lv-person+.lv-person,.lv-none{box-shadow:inset 0 var(--hair) 0 var(--sep)}
.lv-who{display:flex;align-items:flex-start;gap:10px;min-width:0;padding-top:6px}
.lv-who .av{--av:28px}   /* the person's photo, level with their first entry */
.lv-wt{display:flex;flex-direction:column;gap:2px;min-width:0;padding-top:3px}
.lv-who b{font:600 15px/1.3 var(--font-text);letter-spacing:-.012em;overflow-wrap:anywhere}
.lv-who small{font-size:12.5px;line-height:1.35;color:var(--ink-3)}
button.lv-who{align-self:start;justify-self:start;max-width:100%;margin:0 0 0 -8px;padding:6px 10px 6px 8px;border:0;border-radius:12px;background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,transform .25s var(--ease)}
@media (hover:hover){button.lv-who:hover{background:var(--row-hover)}button.lv-who:hover b{color:var(--tint)}}
button.lv-who:active{background:var(--fill);transform:scale(.985);transition-duration:.08s}
button.lv-who:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
button.lv-nm{display:inline;padding:0;border:0;border-radius:4px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
@media (hover:hover){button.lv-nm:hover{color:var(--tint);text-decoration:underline;text-underline-offset:2px}}
button.lv-nm:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lv-entries{display:grid;gap:2px;padding:0;margin:0;list-style:none;min-width:0}
.lv-entry{display:grid;grid-template-columns:minmax(min-content,14.5em) minmax(min-content,7.8em) minmax(min-content,13em) auto minmax(0,1fr) 14px;
  align-items:center;gap:12px;width:100%;min-height:40px;padding:6px 10px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;text-align:left}
.lv-when{display:contents}
.lv-dates{display:flex;align-items:center;gap:9px;min-width:0;font:600 14px/1.3 var(--font-text);font-variant-numeric:tabular-nums;letter-spacing:-.006em}
.lv-dates .sw{width:18px;height:13px}
.lv-dates .nw{white-space:nowrap}
.lv-len{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.lv-len small{font-size:12px;color:var(--ink-3)}
.lv-type{min-width:0;font-size:14px;color:var(--ink)}
.lv-status{display:flex;justify-content:flex-start}
.lv-go{grid-column:6;width:14px;height:14px;color:var(--ink-3)}   /* the chevron keeps to the edge; status stays by the type */
button.lv-entry{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,transform .25s var(--ease)}
button.lv-entry:active{background:var(--fill);transform:scale(.985);transition-duration:.08s}
@media (hover:hover){button.lv-entry:hover{background:var(--row-hover)}}
button.lv-entry:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.lv-none{display:flex;flex-wrap:wrap;gap:2px 10px;padding:12px 18px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.lv-none b{font-weight:600;color:var(--ink-3)}
@media (max-width:1040px){   /* tablets: the name above the entries, each entry still on one line */
  .lv-person{grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 8px 8px 18px}
  .lv-who{align-items:center;padding:2px 10px 4px 0}
  button.lv-who{margin:0 0 2px -8px;padding:4px 12px 4px 8px}
  .lv-wt{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding-top:0}
}
@media (max-width:640px){
  .lv{gap:18px}
  .lv-head{padding-inline:16px}
  .lv-person{padding:10px 6px 8px 16px}
  /* phones, two lines: the dates and how long (which wraps only if it must), then the type and status */
  .lv-entry{grid-template-columns:minmax(0,1fr) auto 14px;grid-template-areas:"when when go" "type status go";gap:3px 10px;padding:8px 10px}
  .lv-when{grid-area:when;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0;padding-left:27px}   /* a wrapped length lines up with the dates */
  .lv-dates{flex:none;max-width:calc(100% + 27px);margin-left:-27px}
  .lv-type{grid-area:type;padding-left:27px;font-size:13.5px;color:var(--ink-2)}
  .lv-status{grid-area:status}
  .lv-go{grid-area:go}
  .lv-none{padding-inline:16px}
}

/* ---------------------------------------------------------------- today: who is off today */
.td{display:grid;gap:22px}
.td-sum{display:grid;gap:4px;padding:18px 20px}
.td-big{display:flex;align-items:baseline;gap:10px}
.td-big .big{font:700 52px/1 var(--font-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.td-person{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;padding:12px 12px 12px 16px}
.td-person+.td-person{box-shadow:inset 0 var(--hair) 0 var(--sep)}
.td-person .avatar{width:36px;height:36px;font-size:13px}
.td-main{min-width:0}
.td-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-top:1px;font:600 15px/1.3 var(--font-text);letter-spacing:-.012em}
.td-part{margin-top:1px;font-size:13.5px;color:var(--ink-2)}
.td-lines{display:grid;gap:2px;margin:3px 0 0 -8px}
.td-line{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:36px;padding:5px 8px;border:0;border-radius:9px;background:none;color:inherit;font:inherit;text-align:left}
.td-line .sw{width:18px;height:13px;margin-top:3px}
.td-when .nw{white-space:nowrap}
.td-txt{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;flex:1 1 auto;min-width:0;font-size:14px;line-height:1.4;color:var(--ink-2)}
.td-what b{font-weight:600;color:var(--ink)}
.td-when{font-variant-numeric:tabular-nums}
.td-go{align-self:center;width:14px;height:14px;flex:none;color:var(--ink-3)}
button.td-line{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,transform .25s var(--ease)}
button.td-line:active{background:var(--fill);transform:scale(.985);transition-duration:.08s}
@media (hover:hover){button.td-line:hover{background:var(--row-hover)}}
button.td-line:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.lv-head .limit.td-over{font-weight:600;color:var(--red-ink)}
.td-closed{display:grid;gap:6px;padding:20px 22px;box-shadow:var(--sh-card),inset 4px 0 0 var(--cl,var(--bh))}
.td-closed-label{display:flex;align-items:center;gap:8px;font:600 13px/1.3 var(--font-text);color:var(--ink-2)}
.td-closed h2{font:700 24px/1.2 var(--font-display);letter-spacing:-.018em;text-wrap:balance}

/* ---------------------------------------------------------------- tables: a sortable table on wide screens, list rows on phones */
.table-wrap{border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums}
table.data th{padding:12px 12px 9px;background:var(--surface);box-shadow:inset 0 calc(-1 * var(--hair)) 0 var(--sep);text-align:left;vertical-align:bottom;white-space:nowrap;
  font:600 12.5px/1.25 var(--font-text);color:var(--ink-2)}
table.data td{padding:11px 12px;border-top:var(--hair) solid var(--sep);vertical-align:middle;white-space:nowrap}
table.data tbody tr:first-child td{border-top:0}
table.data th:first-child,table.data td:first-child{padding-left:16px}
table.data th:last-child,table.data td:last-child{padding-right:16px}
table.data .r{text-align:right}
table.data tr.click{cursor:pointer;transition:background-color .15s}
@media (hover:hover){table.data tr.click:hover{background:var(--row-hover)}}
table.data tr.click:active{background:var(--fill-2);transition-duration:0s}
table.data tr.click:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
table.data .go{width:30px;padding-left:0}
.chev{display:block;width:8px;height:8px;margin:0 auto;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);opacity:.6}
.c-name b{font-weight:600}
.warn{color:var(--gold-ink);font-weight:700}
.neg{color:var(--red-ink);font-weight:700}
@media (max-width:820px){
  table.data thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.data,table.data tbody,table.data tr,table.data td{display:block}
  table.data tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;padding:13px 16px}
  table.data tbody tr+tr{border-top:var(--hair) solid var(--sep)}
  table.data td{padding:0!important;border:0!important;white-space:normal;text-align:left!important}
  table.data td[data-label]::before{content:attr(data-label);display:block;margin-bottom:2px;font:500 11.5px/1.3 var(--font-text);color:var(--ink-3)}
  table.data.reqs tbody tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name dec" "dates days" "sug sug" "req when" "chk chk";gap:8px 14px}
  .reqs td.c-name{grid-area:name}
  .reqs td.c-dec{grid-area:dec;justify-self:end}
  .reqs td.c-dates{grid-area:dates}
  .reqs td.c-days{grid-area:days;text-align:right!important}
  .reqs td.c-sug{grid-area:sug}
  .reqs td.c-req{grid-area:req}
  .reqs td.c-when{grid-area:when;text-align:right!important}
  .reqs td.c-chk{grid-area:chk}
  .reqs td.go{display:none}
}

/* ---------------------------------------------------------------- request sheet: rises from below, follows the finger, flicks away */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.sheet .scrim,.alertdlg .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0}
.sheet.closing,.alertdlg.closing{pointer-events:none}
.sheet .panel{position:relative;display:flex;flex-direction:column;width:min(620px,100%);max-height:100%;border-radius:var(--r-sheet);background:var(--surface);
  box-shadow:var(--sh-sheet);overflow:hidden;will-change:transform;outline:none}
.sheet-content{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.grabber{display:none}
.dlg-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 14px 20px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet.dragging .dlg-head,.sheet.dragging .grabber{cursor:grabbing}
.dlg-head h2{font:700 22px/1.2 var(--font-display);letter-spacing:-.018em;overflow-wrap:anywhere}
.dlg-head .subtle{margin-top:2px}
.dlg-body{flex:1 1 auto;display:flex;flex-direction:column;gap:18px;padding:2px 20px 22px;overflow-y:auto;overscroll-behavior:contain}
.dlg-body>*{flex-shrink:0}   /* the body scrolls; its blocks never squash */
.dlg-foot{flex:none;display:grid;gap:12px;padding:14px 20px 18px;border-top:var(--hair) solid var(--sep);background:var(--surface)}
pre.details{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 var(--hair) var(--sep);font:400 13px/1.55 var(--font-text);
  white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.close{display:grid;place-items:center;width:30px;height:30px;flex:none;padding:0;border:0;border-radius:50%;background:var(--fill);color:var(--ink-2);cursor:pointer;
  transition:transform .28s var(--ease),background-color .15s}
.close .ico{width:14px;height:14px}
.close:active{transform:scale(.9);transition-duration:.08s}
@media (hover:hover){.close:hover{background:var(--fill-2);color:var(--ink)}}
@media (max-width:720px){
  .sheet{align-items:flex-end;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 0}
  .sheet .panel{width:100%;border-radius:var(--r-sheet) var(--r-sheet) 0 0}
  .grabber{display:block;flex:none;height:16px;cursor:grab;touch-action:none}
  .grabber::before{content:"";display:block;width:38px;height:5px;margin:7px auto 0;border-radius:3px;background:var(--ink-3);opacity:.45}
  .dlg-head{padding-top:8px}
  .dlg-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}

/* ---------------------------------------------------------------- confirmation (an Apple-style alert) and toast */
.alertdlg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px}
.alertdlg .box{position:relative;width:min(100%,320px);border-radius:16px;background:var(--mat-alert);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--sh-sheet);overflow:hidden;text-align:center;opacity:0}
.alert-text{display:grid;gap:6px;padding:20px 18px 18px}
.alert-text h2{font:600 17px/1.3 var(--font-text);letter-spacing:-.02em}
.alert-text p{font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.alert-btns{display:grid;grid-template-columns:1fr 1fr;border-top:var(--hair) solid var(--sep)}
.alert-btns button{min-height:46px;padding:0 10px;border:0;background:none;font:400 17px/1.2 var(--font-text);letter-spacing:-.02em;color:var(--tint);cursor:pointer;transition:background-color .1s}
.alert-btns button+button{border-left:var(--hair) solid var(--sep)}
.alert-btns button.go{font-weight:600;color:var(--green-ink)}
.alert-btns button.danger{font-weight:600;color:var(--red)}
.alert-btns button:active{background:var(--fill)}
.alert-btns button:focus-visible{outline-offset:-3px}
.toast-host{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--tabbar-h) + 20px);z-index:95;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.toast{max-width:560px;padding:11px 18px;border-radius:20px;background:var(--toast);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--on-toast);
  font:600 14.5px/1.35 var(--font-text);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);pointer-events:auto}

/* ---------------------------------------------------------------- My Leave (all staff on the FLR Hub, and approvers' own tab): one person's requests and balance */
html.staff #copy-form{display:none}
.mine{display:grid;gap:22px}
.mine-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.mine-top{grid-template-columns:minmax(0,1fr)}}
.mine .card{display:grid;gap:12px;padding:18px 20px 20px}
.mine .card h2{font:600 19px/1.25 var(--font-display);letter-spacing:-.017em}
.mb-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.mb-big{display:flex;align-items:baseline;gap:8px}
.mb-big .big{font:700 56px/1 var(--font-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mb-big .big.neg{color:var(--red-ink)}
.mb-unit{font:600 17px/1 var(--font-text);color:var(--ink-2)}
.mb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--hair);margin:0;border-radius:12px;background:var(--sep);box-shadow:0 0 0 var(--hair) var(--sep);overflow:hidden}
.mb-grid div{padding:10px 12px;background:var(--surface-2)}
.mb-grid dt{font:500 12.5px/1.3 var(--font-text);color:var(--ink-3)}
.mb-grid dd{margin:3px 0 0;font:700 21px/1.15 var(--font-num)}
.mb-grid dd.neg{color:var(--red-ink)}
.mine-request p{font-size:14.5px;color:var(--ink-2)}
.mine-request .btn{justify-self:start}
/* The days FLR is closed in the chosen year, under the button: bank holidays, then the company close days. The dots are
   the Diary's closure colours; the first column is one width in both lists so they line up. */
.mine-closed{display:grid;gap:14px;margin-top:4px;padding-top:16px;box-shadow:inset 0 var(--hair) 0 var(--sep)}
.mine-closed h3{font:600 14px/1.3 var(--font-text);letter-spacing:-.006em;color:var(--ink)}
.cl-list{display:grid;gap:6px;margin:7px 0 0;padding:0;list-style:none}
.cl-list li{display:grid;grid-template-columns:8px 6.3em minmax(0,1fr);column-gap:10px;align-items:start;font-size:14px;line-height:1.35}
.cl-list .sw{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--cl);box-shadow:none}
.cl-when{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl-what{min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.cl-list li.wide .cl-when{grid-column:2 / -1}   /* a line with a date only (a company close day) */
.mine-sect{margin:0 4px 10px;font:600 17px/1.3 var(--font-display);letter-spacing:-.016em}
.mine-rows{padding:0;list-style:none;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);overflow:hidden}
.mine-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px}
.mine-row+.mine-row{box-shadow:inset 0 var(--hair) 0 var(--sep)}
.mr-dates{font-weight:600;font-variant-numeric:tabular-nums}
/* When it was requested, and when it was decided, side by side under the request */
.rq-times{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:6px}
.rq-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.rq-k{font:600 10.5px/1.25 var(--font-text);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.rq-v{font-size:12.5px;line-height:1.35;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rq-when,.rq-by{white-space:nowrap}

@media (max-width:600px){   /* phones: the two times across the whole row, so they stay side by side */
  .mine-row:has(.rq-times){grid-template-columns:46px minmax(0,1fr);grid-template-areas:"badge dates" "badge bits" "badge status" "times times";align-items:start;gap:2px 12px}
  button.mine-row:has(.rq-times){grid-template-columns:46px minmax(0,1fr) 14px;grid-template-areas:"badge dates go" "badge bits go" "badge status go" "times times times"}
  .mine-row:has(.rq-times) .mr-main{display:contents}
  .mine-row:has(.rq-times) .ag-date{grid-area:badge}
  .mine-row:has(.rq-times) .mr-dates{grid-area:dates}

  .mine-row:has(.rq-times) .mr-status{grid-area:status;grid-column:auto;margin-top:6px}
  .mine-row:has(.rq-times) .mr-go{grid-area:go;grid-row:auto;align-self:center}
  .mine-row:has(.rq-times) .rq-times{grid-area:times;margin-top:10px;flex-wrap:nowrap}   /* "by …" goes under its time instead */
}
.mr-main{min-width:0}
.empty-act{margin-top:12px}
@media (max-width:420px){.mine-row{grid-template-columns:46px minmax(0,1fr)}.mr-status{grid-column:2}}
/* A person's record (approvers): the same parts, with "When FLR is closed" beside the days left, each request opening
   the request, and their other leave with its type's Diary colour */
.rec-closed .mine-closed{margin-top:0;padding-top:0;box-shadow:none}
.mine-rows>li+li>.mine-row{box-shadow:inset 0 var(--hair) 0 var(--sep)}
button.mine-row{grid-template-columns:46px minmax(0,1fr) auto 14px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background-color .15s}
button.mine-row .mr-main>span{display:block}
.mr-go{width:14px;height:14px;color:var(--ink-3)}
@media (hover:hover){button.mine-row:hover{background:var(--row-hover)}}
button.mine-row:active{background:var(--fill);transition-duration:.08s}
button.mine-row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media (max-width:420px){
  button.mine-row{grid-template-columns:46px minmax(0,1fr) 14px}
  button.mine-row .mr-go{grid-column:3;grid-row:1/span 2}
}
.ol-type{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.ol-type .sw{width:9px;height:9px;border-radius:50%;box-shadow:none}
.sect-sum{max-width:80ch;margin:-4px 4px 10px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.sect-sum b{font-weight:600;color:var(--ink)}
.mine-none{padding:14px 18px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-card);font-size:14px;color:var(--ink-2)}

/* ---------------------------------------------------------------- before leave tracking starts: notes, the Diary's first month, Today's start card */
.lt-note{padding:10px 14px;border-radius:12px;background:var(--tint-soft);color:var(--ink);font-size:14px;line-height:1.45}
.lt-note b{font-weight:600}
#diary-body>.lt-note{margin-bottom:12px}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn:disabled:active{transform:none}
@media (hover:hover){.iconbtn:disabled:hover{background:var(--fill)}}
.td-start{display:grid;gap:6px;padding:20px 22px}
.td-start h2{font:700 20px/1.25 var(--font-display);letter-spacing:-.016em;text-wrap:balance}
.td-start p{max-width:60ch;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.td-start .btn{justify-self:start;margin-top:8px}
/* My Leave: one leave year's requests, grouped (going ahead, waiting, not going ahead), then any sent before tracking started.
   The date is the row's title, so these rows have no date badge; when it was requested and decided goes across the row. */
.mine-acts{display:flex;flex-wrap:wrap;gap:8px}
.mine-reqs .mine-sect{margin-bottom:6px}
.mine-grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 4px 8px;font:600 13.5px/1.3 var(--font-text);letter-spacing:-.003em;color:var(--ink-2)}
.mine-nothing{margin:4px 4px 0;font-size:14px;color:var(--ink-3)}
details.mine-grp>summary{list-style:none;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
details.mine-grp>summary::-webkit-details-marker{display:none}
details.mine-grp>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mine-grp-h h3{font:inherit;color:inherit}
.mine-grp-h .ico{width:15px;height:15px;color:var(--ink-3);transition:transform .25s var(--ease)}
details.mine-grp[open]>summary .ico{transform:rotate(90deg)}

.mine-row.nb,.mine-row.nb:has(.rq-times){grid-template-columns:minmax(0,1fr) auto;grid-template-areas:none;align-items:center;gap:0 12px}
.mine-row.nb:has(.rq-times) .mr-main{display:block}
.mine-row.nb .mr-status,.mine-row.nb:has(.rq-times) .mr-status{grid-area:auto;grid-column:2;margin-top:0}
.mine-row.nb .mr-times{grid-column:1 / -1;display:grid;gap:4px}
.mine-row.nb .mr-times .rq-times,.mine-row.nb:has(.rq-times) .rq-times{grid-area:auto;margin-top:8px}
/* Check dates: a sheet with the first and last day, and the working days the existing count gives them */
.cd-head{position:relative;justify-content:center;padding-inline:52px;text-align:center}
.cd-head .close{position:absolute;top:16px;right:16px}
.cd-title{display:grid;gap:4px}
.cd-title .subtle{font-size:14px}
.cd-rows{border-radius:12px;background:var(--surface);box-shadow:0 0 0 var(--hair) var(--sep);overflow:hidden}
.cd-row{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;font-size:15px;cursor:pointer;transition:background-color .15s}
.cd-row+.cd-row{box-shadow:inset 0 var(--hair) 0 var(--sep)}
@media (hover:hover){.cd-row:hover{background:var(--row-hover)}}
.cd-k{flex:none;width:52px;color:var(--ink-3)}
.cd-v{font-weight:600;font-variant-numeric:tabular-nums}
.cd-in{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.cd-row:has(.cd-in:focus-visible){outline:2px solid var(--focus);outline-offset:-2px;border-radius:12px}
.cd-res{display:grid;gap:6px;padding:14px 16px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 var(--hair) var(--sep)}
.cd-res.zero{background:var(--gold-soft);box-shadow:none}
.cd-n{font:700 17px/1.3 var(--font-display);letter-spacing:-.012em}
.cd-res p{font-size:14.5px;line-height:1.5}
.cd-res b{font-weight:600}
.cd-form{width:100%}

/* ---------------------------------------------------------------- motion preferences: springs jump, slides become fades (see FLRUI) */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}

<script>
/* =====================================================================
   Motion and gestures, as in the FLR Hub and the Speeding Report (from
   WWDC "Designing Fluid Interfaces"): springs set by damping ratio and
   response, motion that starts from where things are on screen, the
   finger's speed handed to the animation, flicks projected forward to
   choose where things land, and rubber-banding at the edges.

      this.precision = o.precision || .5; this.onUpdate = o.onUpdate || null; this.onRest = null;
      this.set(o.damping == null ? 1 : o.damping, o.response || .4);
      this._step = this._step.bind(this);
    }
    set(damping, response) { this.damping = damping; this.response = response; this.k = Math.pow(2 * Math.PI / response, 2); this.c = 4 * Math.PI * damping / response; return this; }
    to(target, o = {}) {
      if (o.damping != null || o.response != null) this.set(o.damping == null ? this.damping : o.damping, o.response || this.response);
      if (o.velocity != null) this.v = o.velocity;
      this.target = target; this.onRest = o.onRest || null;
      if (reduced()) { this.jump(target); const r = this.onRest; this.onRest = null; if (r) r(); return this; }
      if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(this._step); }
      return this;
    }
    jump(value) { this.stop(); this.x = this.target = value; this.v = 0; if (this.onUpdate) this.onUpdate(value, 0); return this; }
    stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; return this; }
    get moving() { return !!this.raf; }
    _step(now) {
      const dt = clamp((now - this.last) / 1000, 0, .064); this.last = now;
      const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
      for (let i = 0; i < n; i++) { const a = -this.k * (this.x - this.target) - this.c * this.v; this.v += a * h; this.x += this.v * h; }
      if (Math.abs(this.v) < this.precision * 12 && Math.abs(this.x - this.target) < this.precision) {

      add(e) { p.push([e.clientX, e.clientY, e.timeStamp || performance.now()]); while (p.length > 2 && p[p.length - 1][2] - p[0][2] > 100) p.shift(); },
      v() { if (p.length < 2) return { x: 0, y: 0 }; const a = p[0], b = p[p.length - 1], dt = (b[2] - a[2]) / 1000; return dt > 0 ? { x: (b[0] - a[0]) / dt, y: (b[1] - a[1]) / dt } : { x: 0, y: 0 }; },

   --------------------------------------------------------------------- */
async function gql(query, variables, { read = false } = {}) {
  const input = { query, variables: JSON.stringify(variables || {}) };
  let attempt = 0;
  for (;;) {
    try {
      const res = await state.mcp.callTool(SERVER, TOOL, input, { cache: false });
      let p = res && res.payload;
      if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { /* not JSON */ } }
      if (typeof p === 'string' || p === null || p === undefined) {
        throw { code: 'tool_error', message: typeof p === 'string' ? p : 'monday.com returned an empty answer.' };
      }
      return p;
    } catch (err) {
      if (read && attempt === 0 && err && err.retryable) {
        attempt++;
        const wait = Math.min(err.retryAfterMs || (1200 + Math.random() * 1800), 8000);
        await new Promise((r) => setTimeout(r, wait));
        continue;
      }
      throw err;
    }
  }
}

const COLS = `id text value ... on StatusValue { label } ... on NumbersValue { number } ... on DateValue { date } ... on TimelineValue { from to } ... on BoardRelationValue { linked_item_ids }`;

  req: Object.values(REQ), alw: Object.values(ALW), grp: Object.values(GRP), clo: Object.values(CLO), oth: Object.values(OTH),

const LOAD_QUERY = `query (${BOARD_KEYS.map((k) => `$${k}: ID!, $${k}Cols: [String!]`).join(', ')}) {
  me { name }
  ${BOARD_KEYS.map((k) => `${k}: boards(ids: [$${k}]) { items_page(limit: 250) { cursor items { ${ITEM.replace('$COLS', `$${k}Cols`)} } } }`).join('\n  ')}
}`;

async function loadBoards() {
  const vars = {};
  for (const k of BOARD_KEYS) { vars[k] = BOARDS[k]; vars[`${k}Cols`] = BOARD_COLS[k]; }
  const p = await gql(LOAD_QUERY, vars, { read: true });
  const out = { me: p.me && p.me.name, items: {}, missing: [] };
  for (const k of BOARD_KEYS) {
    const boards = p[k] || [];
    if (!boards.length) { out.missing.push(BOARD_NAMES[k]); out.items[k] = []; continue; }
    const page = boards[0].items_page || { items: [] };
    const items = [...(page.items || [])];
    let cursor = page.cursor;
    for (let guard = 0; cursor && guard < 40; guard++) {
      const n = await gql(NEXT_QUERY, { cursor, cols: BOARD_COLS[k] }, { read: true });
      const np = n.next_items_page || {};

        decidedAt: changedAt(c[REQ.decision]),   // when the Decision last changed: when it was accepted, denied or cancelled
      },
    };
  });
  const staff = raw.items.alw.map((it) => {
    const c = cv(it);
    return {
      id: String(it.id), name: it.name || '', groupIds: links(c[ALW.group]), allowance: num(c[ALW.allowance]),
      shutdownReserve: num(c[ALW.shutdown]), carriedOver: num(c[ALW.carried]), takenBefore: null,
      savedBooked: num(c[ALW.booked]), savedPending: num(c[ALW.pending]),
      email: ((c[ALW.email] && (c[ALW.email].email || txt(c[ALW.email]))) || '').trim().toLowerCase() || null,
    };
  });
  const groups = raw.items.grp.map((it) => {
    const c = cv(it);
    return { id: String(it.id), name: it.name || '', memberIds: links(c[GRP.members]), maxOff: num(c[GRP.maxOff]), rules: txt(c[GRP.rules]) || '' };
  });
  const bankHolidays = new Map(), closureTypes = new Map();
  for (const it of raw.items.clo) {
    const c = cv(it);
    const d = c[CLO.date] ? cleanDate(c[CLO.date].date || c[CLO.date].text) : null;
    if (!d) continue;
    const type = lab(c[CLO.type]) || 'Bank holiday';
    bankHolidays.set(d, isCloseDay(type) ? CLOSE_DAY : it.name || 'Bank holiday');   // the name the Diary, Today and checks show
    closureTypes.set(d, type);
  }
  const other = raw.items.oth.map((it) => {
    const c = cv(it), d = timeline(c[OTH.dates]), staffIds = links(c[OTH.staff]);
    const gid = it.group && it.group.id;
    return {
      id: 'o' + it.id, itemId: String(it.id), employeeName: it.name || '', staffId: staffIds[0] || null,
      type: OTHER_GROUP_TYPES[gid] || (it.group && it.group.title) || 'Other leave',
      from: d.from, to: d.to, halfDay: halfDayFromLabel(lab(c[OTH.halfDay])),
      cur: { workingDays: num(c[OTH.workingDays]), staffIds },

}

function rebuild() {
  const d = state.data;
  state.ctx = buildContext({ requests: d.requests, staff: d.staff, groups: d.groups, bankHolidays: d.bankHolidays, today: d.today, otherLeave: d.other });
  state.evals = new Map();
}
function evaluate(r) {
  if (!state.evals.has(r.id)) state.evals.set(r.id, evaluateRequest(state.ctx, r));
  return state.evals.get(r.id);
}

/* ---------------------------------------------------------------------
   Write-back: keep the board's check columns and balances in step
   --------------------------------------------------------------------- */
const r1 = (n) => Math.round(n * 10) / 10;
const asStr = (n) => (n === null || n === undefined ? '' : String(r1(n)));
function isPlaceholder(name) { const t = (name || '').trim().toLowerCase(); return !t || PLACEHOLDER_NAMES.includes(t); }

function computeWrites() {
  const ctx = state.ctx, writes = [];
  for (const r of state.data.requests) {
    const v = {}, cur = r.cur, owner = ctx.staffOf(r), d = ctx.daysOf(r), after = {};
    if (isPending(r)) {
      const res = evaluate(r);
      if (cur.suggested !== res.suggested) { v[REQ.suggested] = { label: res.suggested }; after.suggested = res.suggested; }
      if (cur.allowanceCheck !== res.allowanceStatus) { v[REQ.allowanceCheck] = { label: res.allowanceStatus }; after.allowanceCheck = res.allowanceStatus; }
      if (cur.groupCheck !== res.groupStatus) { v[REQ.groupCheck] = { label: res.groupStatus }; after.groupCheck = res.groupStatus; }
      if (asStr(cur.workingDays) !== asStr(res.days.total)) { v[REQ.workingDays] = String(res.days.total); after.workingDays = res.days.total; }
      if (asStr(cur.leftAfter) !== asStr(res.leftAfter)) { v[REQ.leftAfter] = asStr(res.leftAfter); after.leftAfter = res.leftAfter; }
      const gt = res.groupNames || '—';
      if ((cur.leaveGroup || '') !== gt) { v[REQ.leaveGroup] = gt; after.leaveGroup = gt; }
      if ((cur.details || '') !== res.details) { v[REQ.details] = { text: res.details }; after.details = res.details; }
    } else if (cur.workingDays === null && d.days.length > 0) {
      v[REQ.workingDays] = String(d.total); after.workingDays = d.total;
    }
    if (owner && cur.staffIds.length === 0) { v[REQ.staff] = { item_ids: [Number(owner.id)] }; after.staffIds = [String(owner.id)]; }
    let rename = null;
    if (owner && isPlaceholder(r.name)) { v.name = owner.name; rename = owner.name; }
    if (Object.keys(v).length) writes.push({ board: BOARDS.req, item: r.id, values: v, apply: () => { Object.assign(cur, after); if (rename) r.name = rename; } });
  }
  for (const s of state.data.staff) {
    const b = balanceFor(ctx, s, ctx.currentYear), v = {};
    if (asStr(s.savedBooked) !== asStr(b.booked)) v[ALW.booked] = String(r1(b.booked));
    if (asStr(s.savedPending) !== asStr(b.pending)) v[ALW.pending] = String(r1(b.pending));
    if (Object.keys(v).length) writes.push({ board: BOARDS.alw, item: s.id, values: v, apply: () => { s.savedBooked = r1(b.booked); s.savedPending = r1(b.pending); } });
  }
  for (const e of state.data.other) {
    const v = {}, owner = ctx.otherStaffOf(e), d = ctx.otherDaysOf(e);
    if (owner && e.cur.staffIds.length === 0) v[OTH.staff] = { item_ids: [Number(owner.id)] };
    if (d.days.length && asStr(e.cur.workingDays) !== asStr(d.total)) v[OTH.workingDays] = String(d.total);
    if (Object.keys(v).length) writes.push({ board: BOARDS.oth, item: e.itemId, values: v, apply: () => { if (owner) e.cur.staffIds = [String(owner.id)]; e.cur.workingDays = d.total; } });
  }
  return writes;
}

async function saveChecks() {
  if (state.savingCount) { state.recheck = true; return; }
  const writes = computeWrites();
  if (!writes.length) return;
  state.savingCount = writes.length;
  renderSaving();
  try {
    for (let i = 0; i < writes.length; i += 10) {
      const batch = writes.slice(i, i + 10);
      const args = [], body = [], vars = {};
      batch.forEach((w, j) => {
        args.push(`$b${j}: ID!, $i${j}: ID!, $v${j}: JSON!`);
        body.push(`w${j}: change_multiple_column_values(board_id: $b${j}, item_id: $i${j}, column_values: $v${j}) { id }`);
        vars[`b${j}`] = w.board; vars[`i${j}`] = w.item; vars[`v${j}`] = JSON.stringify(w.values);
      });
      await gql(`mutation (${args.join(', ')}) { ${body.join(' ')} }`, vars);
      batch.forEach((w) => w.apply());
      state.savingCount = Math.max(0, writes.length - i - batch.length);
      renderSaving();
    }
  } catch (err) {
    showToast('The checks could not be saved to monday.com. They will be saved on the next refresh.');
  } finally {
    state.savingCount = 0;
    renderSaving();
    if (state.recheck) { state.recheck = false; saveChecks(); }
  }
}

/* ---------------------------------------------------------------------
   Loading
   --------------------------------------------------------------------- */
// Where the page opens, once it knows who is looking. Until leave tracking starts, staff open on My Leave: their days and
// requests for the first leave year (Today has nothing to list yet). Otherwise everyone opens as before: on the tab they
// last used, or on Today (staff) and Approvals (approvers).
let opened = false;
function openingView() {
  if (staffView() && beforeTracking()) state.tab = 'mine';
}
async function load() {
  if (!state.mcp) return;
  state.loading = true;
  state.error = null;
  renderChrome();
  try {
    const raw = await loadBoards();
    state.viewer = raw.me || state.viewer;
    state.access = raw.missing;
    state.data = mapData(raw);
    rebuild();
    state.lastLoaded = new Date();
  } catch (err) {
    state.error = err || { code: 'upstream_error', message: 'Unknown error' };
  } finally {
    state.loading = false;
    if (state.data && !opened) { opened = true; openingView(); }
    renderAll();
    if (state.data && !addressRead) { readAddress(); addressRead = true; }
  }
  if (state.data && !state.error && !staffView()) saveChecks();   // staff on the FLR Hub only see their own leave: nothing to check
}

/* ---------------------------------------------------------------------
   Decisions
   --------------------------------------------------------------------- */
const DECISION_ICON = { Accepted: '✅', Denied: '❌', Review: '🔍', Cancelled: '❌', 'New request': '🔄' };
const DECISION_VERB = { Accepted: 'Accepted', Denied: 'Denied', Review: 'Sent to review', Cancelled: 'Cancelled', 'New request': 'Re-opened' };

async function decide(id, action) {
  const r = state.data && state.data.requests.find((x) => x.id === id);
  if (!r || state.busy) return;
  const note = (state.notes[id] || '').trim();
  const details = isPending(r) ? evaluate(r).details : (r.cur.details || '');
  const values = { [REQ.decision]: { label: action }, [REQ.decidedOn]: { date: todayInLondon() } };
  if (note) values[REQ.managersNote] = { text: note };
  state.busy = id;
  renderAll();
  try {
    await gql('mutation ($b: ID!, $i: ID!, $v: JSON!) { change_multiple_column_values(board_id: $b, item_id: $i, column_values: $v) { id } }',
      { b: BOARDS.req, i: id, v: JSON.stringify(values) });
  } catch (err) {
    state.busy = null;
    renderAll();
    showToast(`That decision was not saved: ${describeError(err).body}`);
    return;
  }
  const bodyText = `${DECISION_ICON[action]} ${DECISION_VERB[action]} by ${state.viewer} on ${fmtDate(todayInLondon())}.` +
    (note ? `\nNote: ${note}` : '') + (details ? `\n\nChecks at the time of the decision:\n${details}` : '');
  try {
    await gql('mutation ($i: ID!, $body: String!) { create_update(item_id: $i, body: $body) { id } }',
      { i: id, body: escapeHtml(bodyText).replace(/\n/g, '<br>') });
  } catch (err) {
    showToast('Decision saved. The note on the monday.com item could not be added.');
  }
  delete state.notes[id];
  state.busy = null;
  showToast(`${displayName(r)}: ${DECISION_VERB[action].toLowerCase()}.`);
  await load();
}

/* ---------------------------------------------------------------------

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
const esc = escapeHtml;
// A person's photo (from the FLR server, on the Hub) in a small circle, or their initials in the same circle.
const FACE_SRC = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/;
function faceOf(id) {
  const faces = window.__FLR_LEAVE && window.__FLR_LEAVE.faces, src = faces && id != null ? faces[String(id)] : null;
  return typeof src === 'string' && FACE_SRC.test(src) ? src : null;
}
function initialsOf(name) {

  const known = /\(([^)]+)\)/.exec(n);            // "William (Scott) Duncan" is known as Scott
  if (known) n = `${known[1]} ${n.replace(/\([^)]*\)/, ' ').trim().split(/\s+/).slice(1).join(' ')}`;
  const w = n.split(/\s+/).filter(Boolean);
  return w.length ? (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase() : '?';
}
// "Richard W.": the first name (or the name someone is known by) and the last initial, for narrow calendar cells.
function shortName(name) {
  let n = String(name || '').trim();
  const known = /\(([^)]+)\)/.exec(n);
  if (known) n = `${known[1]} ${n.replace(/\([^)]*\)/, ' ').trim().split(/\s+/).slice(1).join(' ')}`;
  const w = n.split(/\s+/).filter(Boolean);
  return w.length > 1 ? `${w[0]} ${w[w.length - 1][0].toUpperCase()}.` : n;
}
const SHORT_TYPE = { 'Sick leave': 'Sick', 'Unpaid leave': 'Unpaid', 'Study leave': 'Study', 'Compassionate leave': 'Compassionate', 'Medical appointment': 'Medical', 'Maternity / paternity': 'Parental' };
// The name in a calendar entry: whole, shorter and shortest (CSS shows the one that fits the day cell).
const whoName = (full, short, tiny) => `<span class="wf">${esc(full)}</span><span class="ws">${esc(short)}</span><span class="wt">${esc(tiny)}</span>`;
const firstName = (name) => shortName(name).split(' ')[0];
function avatarHtml(id, name) {
  const face = faceOf(id);
  return face ? `<img class="av" src="${esc(face)}" alt="" decoding="async">` : `<span class="av" aria-hidden="true">${esc(initialsOf(name))}</span>`;
}
// A moment from monday.com (stored in UTC) as it was in the UK: "28 Sep 2026, 14:55".
function fmtStamp(iso) {
  const t = Date.parse(iso || '');
  if (!Number.isFinite(t)) return '';
  const p = {};
  for (const x of new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(t))) p[x.type] = x.value;
  return `${p.day} ${p.month.slice(0, 3)} ${p.year}, ${p.hour}:${p.minute}`;
}
// When a request was sent and, once it's decided, when it was accepted, denied or cancelled: shown side by side under it.
// The decision's time is monday.com's own record of the Decision column changing; without one, the "Decided on" date.
const DECIDED_WORD = { accepted: 'Accepted', denied: 'Denied', cancelled: 'Cancelled' };
// Who made the current decision, when it was made on the FLR Hub: the FLR server's audit trail has each decision there
// with the person signed in. One changed since in monday.com (another decision, or the time no longer matching) has no name.
function decidedBy(r) {
  const d = window.__FLR_LEAVE && window.__FLR_LEAVE.decisions ? window.__FLR_LEAVE.decisions[r.id] : null;
  if (!d || typeof d.by !== 'string' || !d.by || decisionFromLabel(d.decision) !== r.decision) return '';
  const hub = Date.parse(d.at), board = Date.parse(r.cur.decidedAt || '');
  return Number.isFinite(hub) && Number.isFinite(board) && Math.abs(hub - board) > 60000 ? '' : d.by;
}
// [label, when, who]: who only for a decision made on the Hub
function requestTimes(r) {
  const out = [[r.imported ? 'Imported' : 'Requested', fmtStamp(r.createdAt) || '—', '']];
  if (DECIDED_WORD[r.decision]) out.push([DECIDED_WORD[r.decision], fmtStamp(r.cur.decidedAt) || (r.cur.decidedOn ? fmtDate(r.cur.decidedOn) : '—'), decidedBy(r)]);
  return out;
}
const whenHtml = (when, by) => `<span class="rq-when">${esc(when)}</span>${by ? ` <span class="rq-by">by ${esc(by)}</span>` : ''}`;
const timesHtml = (r) => `<span class="rq-times">${requestTimes(r).map(([k, v, by]) => `<span class="rq-t"><span class="rq-k">${esc(k)}</span><span class="rq-v">${whenHtml(v, by)}</span></span>`).join('')}</span>`;
function displayName(r) {

  return isPlaceholder(r.name) ? 'Unnamed request' : r.name;
}
function describeError(e) {

  const msg = (e && e.message) || '';
  switch (code) {
    case 'FLR_FORBIDDEN': return { title: 'Only leave approvers can do that', body: msg || 'Ask an FLR administrator if you should approve leave.' };
    case 'FLR_SIGN_IN_REQUIRED': return { title: 'Sign in again', body: msg || 'Your FLR sign-in has expired. Go back to the FLR Hub, sign in, then try again.' };
    case 'FLR_VALIDATION': return { title: 'That change isn’t allowed', body: msg || 'The FLR server refused it. Nothing was changed.' };
    case 'tool_error': return { title: 'monday.com refused the change', body: msg || 'monday.com reported an error. Nothing was changed.' };
    case 'not_configured': return { title: 'Annual Leave isn’t connected to monday.com yet', body: msg || 'The monday.com key hasn’t been added to the FLR server.' };
    case 'offline': return { title: 'Can’t reach the FLR server', body: msg || 'Check your connection, then press Refresh.' };

let toastTimer = null;
function showToast(message) {

  if (!FLRUI.reduced() && el.animate) el.animate([{ opacity: 0, transform: 'translate3d(0,14px,0) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.25,1,.5,1)' });

function monthName(y, m) { return new Date(Date.UTC(y, m, 1)).toLocaleString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }); }
function monthDays(y, m) {
  const out = [], last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  for (let d = 1; d <= last; d++) out.push(`${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`);

function closureClass(d) {

function workingWindow(first, last, pad = 3) {
  const isWork = (d) => !isWeekend(d) && !state.ctx.bankHolidays.has(d);
  const before = [];
  let cur = first;
  for (let i = 0; i < 40 && before.length < pad; i++) { cur = addDays(cur, -1); if (isWork(cur)) before.unshift(cur); }
  const mid = [];
  for (let d = first; d <= last; d = addDays(d, 1)) if (isWork(d)) mid.push(d);
  const after = [];
  cur = last;

// staff id -> date -> { kind:'annual'|'other', decision, type, amount, request, entry }
function offMap(dates, { pending = true, other = true } = {}) {
  const ctx = state.ctx, map = new Map();
  const put = (sid, date, cell) => {
    if (!map.has(sid)) map.set(sid, new Map());
    const row = map.get(sid), prev = row.get(date);
    const rank = (c) => (c.kind === 'annual' ? (c.decision === 'accepted' ? 3 : 2) : 1);
    if (!prev || rank(cell) > rank(prev)) row.set(date, cell);

  for (const date of dates) {
    for (const e of whoIsOff(ctx, date, { includePending: pending })) {
      if (e.staff) put(String(e.staff.id), date, { kind: 'annual', decision: e.request.decision, amount: e.amount, request: e.request });
    }
    if (other) for (const e of whoIsOffOther(ctx, date)) {

    }

}

  if (cell.kind === 'annual') {
    const r = cell.request, cls = r.decision === 'accepted' ? 'accepted' : r.decision === 'review' ? 'review' : 'new';
    const status = r.decision === 'accepted' ? 'Accepted' : r.decision === 'review' ? 'Review' : 'New request';
    const title = `${displayName(r)} · annual leave · ${fmtRange(r.from, r.to)}${cell.amount === 0.5 ? ' · half day' : ''} · ${status}`;
    return `<button class="fill ${cls}${half}" data-act="open" data-id="${esc(r.id)}" title="${esc(title)}" aria-label="${esc(title)}"></button>`;
  }

  return `<span class="fill${half}" style="background:${colour}" title="${esc(title)}" aria-label="${esc(title)}"></span>`;

const staffIdOf = (r) => { const s = state.ctx && r ? state.ctx.staffOf(r) : null; return s ? s.id : null; };
function emptyHtml(title, text, kind = '') {

function banner(kind, title, body, extra) {

}
function focusTitle() { const t = document.getElementById('lt-title'); if (t) t.focus({ preventScroll: true }); }
// A re-render keeps the field being typed in (and its caret); if the focused control went away, focus stays in the page.
function rememberFocus() {
  const a = document.activeElement;

function restoreFocus(f) {

    if (was === undefined) { el.animate([{ opacity: 0, transform: 'scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.25,1,.5,1)' }); continue; }
    const dy = was - el.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) el.animate([{ transform: `translate3d(0,${dy}px,0)` }, { transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.25,1,.5,1)' });
  }
}

// Approvers: accepted Operatives' leave the FLR server couldn't put on the Work Programme, and why.

function renderView() {
  const view = document.getElementById('view');
  const focus = rememberFocus();
  const flip = captureFlip(view);
  const rec = recordPerson();
  setBack(rec ? TABS.find((t) => t.id === state.tab).label : '');
  if (!state.data) {
    const title = VIEW_TITLES[state.tab];
    if (state.loading || state.mcp === undefined) {
      setHead(onHub() ? 'Annual Leave' : title, onHub() ? 'Loading…' : 'Loading from monday.com. If Claude asks, allow monday.com for this page.');
      view.innerHTML = '<div class="skeleton" aria-hidden="true"><div></div><div></div></div>';
    } else {
      setHead(title, '');
