/* ---------- Today: who is off today ---------- */
// Approvers (and the page on Claude) work it out from all the boards, as the diary does: who is off and why, their
// dates and when they're back, how full each leave group is, and requests for today still waiting for a decision.
// Staff on the FLR Hub get the FLR database's list instead: names, groups and all day or half, never the kind of leave.
const PART = { all: 'All day', am: 'Morning', pm: 'Afternoon' };
function nextWorkingDay(d) {
  let x = addDays(d, 1);
  for (let i = 0; i < 60 && (isWeekend(x) || state.ctx.bankHolidays.has(x)); i++) x = addDays(x, 1);
  return x;
}
function backText(line, day) {
  if (line.part === 'am' && line.to === day) return 'back this afternoon';
  const b = nextWorkingDay(line.to);
  return b === addDays(day, 1) ? 'back tomorrow' : `back ${fmtDate(b, yearOf(b) !== yearOf(day))}`;
}
function closedCard(name, kind) {
  const cl = isCloseDay(kind) ? 'shut' : /jeff/i.test(kind || '') ? 'jeff' : 'bh';
  if (cl === 'shut') name = CLOSE_DAY;   // staff get the board's own name from the FLR server
  return `<section class="card td-closed" style="--cl:var(--${cl})"><p class="td-closed-label"><i class="sw closed-${cl}"></i>Closed today</p>
    <h2>${esc(name)}</h2><p class="subtle">No one is working today, so no one is listed as off.</p></section>`;
}
function renderToday() {
  const day = todayInLondon();
  const dt = new Date(toUTC(day)), part = (o) => dt.toLocaleDateString('en-GB', { ...o, timeZone: 'UTC' });
  setHead('Today', `${part({ weekday: 'long' })} ${dt.getUTCDate()} ${part({ month: 'long' })} ${dt.getUTCFullYear()}`);
  return staffView() ? renderTodayStaff(day) : renderTodayFull(day);
}
// Until leave tracking starts, nothing is listed, so Today says when its list starts instead of "Everyone's in today",
// and points to where the tracked leave is: My Leave for staff, the Diary for approvers.
function trackingStartCard(to) {
  const [id, label] = to === 'mine' ? ['mine', 'Go to My Leave'] : ['diary', 'Go to the Diary'];
  return `<section class="card td-start" aria-labelledby="td-start-h"><h2 id="td-start-h">Today’s list starts on ${esc(TRACKING_START_TEXT)}</h2>
    <p>That’s when leave tracking begins. Until then it can’t show who is off, because leave before January was booked the old way.</p>
    <button class="btn primary" type="button" data-act="tab" data-id="${id}">${label}</button></section>`;
}
function renderTodayFull(day) {
  const ctx = state.ctx, closure = state.data.bankHolidays.get(day);
  if (closure) return closedCard(closure, state.data.closureTypes.get(day));
  if (isWeekend(day)) return emptyHtml('It’s the weekend', 'No one is working today. The week ahead is in the Diary.', 'diary');
  const off = new Map(), waiting = [];
  const add = (staff, name, line) => {
    const k = staff ? `s${staff.id}` : `n${normaliseName(name)}`;
    if (!off.has(k)) off.set(k, { staff, name: staff ? staff.name : name, lines: [] });
    off.get(k).lines.push(line);
  };
  for (const e of whoIsOff(ctx, day, { includePending: true })) {
    const r = e.request, d = ctx.daysOf(r);
    const line = { kind: 'annual', part: e.amount === 0.5 ? (r.halfDay === 'pm' ? 'pm' : 'am') : 'all', from: d.from, to: d.to, request: r };
    if (r.decision === 'accepted') add(e.staff, displayName(r), line);
    else waiting.push({ staff: e.staff, name: e.staff ? e.staff.name : displayName(r), line });
  }
  for (const e of whoIsOffOther(ctx, day)) {
    const d = ctx.otherDaysOf(e.entry);
    add(e.staff, e.entry.employeeName, { kind: 'other', type: e.type, part: e.amount === 0.5 ? (e.entry.halfDay === 'pm' ? 'pm' : 'am') : 'all', from: d.from, to: d.to });
  }
  const y = yearOf(day);
  const lineHtml = (l) => {
    const sw = l.kind === 'annual' ? `<i class="sw ${l.request.decision === 'accepted' ? 'acc' : l.request.decision === 'review' ? 'rev' : 'new'}"></i>`
      : `<i class="sw" style="background:${OTHER_TYPE_COLOURS[l.type] || '#c4c4c4'}"></i>`;
    const what = l.kind === 'annual' ? 'Annual leave' : l.type;
    const text = `<span class="td-what"><b>${esc(what)}</b> · ${PART[l.part]}</span><span class="td-when"><span class="nw">${esc(lvRange(l.from, l.to, y))}</span> · <span class="nw">${esc(backText(l, day))}</span></span>`;
    return l.kind === 'annual'
      ? `<button class="td-line" type="button" data-act="open" data-id="${esc(l.request.id)}">${sw}<span class="td-txt">${text}</span>${icon('chev-r', 'ico td-go')}</button>`
      : `<div class="td-line">${sw}<span class="td-txt">${text}</span></div>`;
  };
  const person = (p) => `<li class="td-person">${avatar(p.name, p.staff && p.staff.id)}<div class="td-main"><p class="td-name">${esc(p.name)}</p><div class="td-lines">${p.lines.map(lineHtml).join('')}</div></div></li>`;
  // Leave groups in name order, each with how many are on annual leave against its limit; people in two groups show in both.
  const people = [...off.values()].sort((a, z) => a.name.localeCompare(z.name));
  const secs = [];
  for (const g of [...state.data.groups].sort((a, z) => a.name.localeCompare(z.name))) {
    const ids = ctx.membersByGroup.get(String(g.id)) || new Set();
    const inGroup = people.filter((p) => p.staff && ids.has(String(p.staff.id)));
    if (!inGroup.length) continue;
    // The group's limit counts annual leave only; other leave is shown beside it, so the day's whole picture is there.
    const annual = inGroup.filter((p) => p.lines.some((l) => l.kind === 'annual')).length, limit = maxOffOf(g);
    const other = inGroup.filter((p) => p.lines.some((l) => l.kind === 'other')).length;
    secs.push({ title: g.name, note: `${annual} annual + ${other} other off · max ${limit}`, over: annual > limit, people: inGroup });
  }
  const loose = people.filter((p) => p.staff && !(ctx.groupsByStaff.get(String(p.staff.id)) || new Set()).size);
  if (loose.length) secs.push({ title: 'No group', note: '', people: loose });
  const unknown = people.filter((p) => !p.staff);
  if (unknown.length) secs.push({ title: 'Not on the allowance board', note: '', people: unknown });
  const annualN = people.filter((p) => p.lines.some((l) => l.kind === 'annual')).length, otherN = people.filter((p) => p.lines.some((l) => l.kind === 'other')).length;
  const bits = [annualN ? `${annualN} on annual leave` : '', otherN ? `${otherN} on other leave` : '', waiting.length ? `${waiting.length} waiting for a decision` : ''].filter(Boolean);
  const summary = people.length
    ? `<section class="card td-sum"><p class="td-big"><span class="big num">${people.length}</span><span class="mb-unit">${people.length === 1 ? 'person' : 'people'} off today</span></p>
        <p class="subtle">${esc(bits.join(' · '))}</p></section>`
    : beforeTracking(day) ? trackingStartCard('diary')
    : emptyHtml('Everyone’s in today', waiting.length ? 'No one has leave booked for today.' : 'No one has leave booked for today, and nothing for today is waiting for a decision.', 'done');
  const groups = secs.map((s) => `<section class="lv-sec"><h3 class="lv-head">${esc(s.title)}${s.note ? `<span class="limit${s.over ? ' td-over' : ''}">${esc(s.note)}</span>` : ''}</h3>
      <ul class="lv-card">${s.people.map(person).join('')}</ul></section>`).join('');
  const wait = waiting.length ? `<section class="lv-sec"><h3 class="lv-head">Waiting for a decision<span class="limit">asked for today, not decided yet</span></h3>
      <ul class="lv-card">${waiting.sort((a, z) => a.name.localeCompare(z.name)).map((w) => `<li class="td-person">${avatar(w.name, w.staff && w.staff.id)}<div class="td-main"><p class="td-name">${esc(w.name)}${pillFor(w.line.request.decision)}</p>
        <div class="td-lines"><button class="td-line" type="button" data-act="open" data-id="${esc(w.line.request.id)}"><i class="sw ${w.line.request.decision === 'review' ? 'rev' : 'new'}"></i>
        <span class="td-txt"><span class="td-what"><b>Annual leave</b> · ${PART[w.line.part]}</span><span class="td-when"><span class="nw">${esc(lvRange(w.line.from, w.line.to, y))}</span></span></span>${icon('chev-r', 'ico td-go')}</button></div></div></li>`).join('')}</ul></section>` : '';
  return `<div class="td">${summary}${groups}${wait}</div>
    <p class="foot">Accepted annual leave and other leave on the leave boards. Everyone signed in to the FLR Hub sees who is off today, with names only: not the kind of leave, its dates or notes.</p>`;
}
function renderTodayStaff(day) {
  const t = window.__FLR_LEAVE && window.__FLR_LEAVE.today;
  if (!t) return emptyHtml('Today isn’t available yet', 'The FLR server hasn’t been updated for this yet. Try again later.', 'diary');
  if (t.closure) return closedCard(t.closure.name, t.closure.kind);
  if (t.weekend) return emptyHtml('It’s the weekend', 'No one is working today.', 'diary');
  if (!t.off.length) return beforeTracking(day) ? trackingStartCard('mine') : emptyHtml('Everyone’s in today', 'No one has leave booked for today.', 'done');

  for (const p of t.off) for (const g of (p.groups && p.groups.length ? p.groups : ['No group'])) { if (!byGroup.has(g)) byGroup.set(g, []); byGroup.get(g).push(p); }

function renderAllowance(ev, r) {

function renderCalendar(dates, map, sections) {

/* ---------- Leave List: each person's leave for the year, in date order ---------- */

function leaveListEntries(y, visible) {

  }

    }

      <ul class="lv-card">${people}${noneHtml}</ul></section>`;
  }).join('');
  if (!listed) return emptyHtml(`No leave in ${y}`, `No one in this view has leave in ${y}. Try another year, name or leave group.`, 'diary');
  return `<div class="lv">${html}</div>
    <p class="foot">Each person’s leave in ${y}, in date order. Annual leave shows accepted requests, and new and review ones while “Show pending” is on; denied and cancelled requests aren’t listed. Select a name for that person’s leave record, or annual leave to see the request.</p>`;
}

/* ---------- My Leave: all staff see only this on the FLR Hub; leave approvers have it as a tab of their own ---------- */
// Whose card it is comes from the FLR sign-in. Staff only ever receive their own record; an approver's is the one with
// their sign-in email in its Email column, and their requests are the ones linked (or named) to that record.
function mineFor() {
  const hub = window.__FLR_LEAVE || {}, email = String((hub.me && hub.me.email) || '').trim().toLowerCase();
  if (staffView()) return { me: state.data.staff[0] || null, requests: state.data.requests, email };
  const me = (email && state.data.staff.find((s) => s.email === email)) || null;
  const requests = me ? state.data.requests.filter((r) => { const s = state.ctx.staffOf(r); return Boolean(s) && String(s.id) === String(me.id); }) : [];
  return { me, requests, email };
}
// What's closed in a leave year, from the FLR - Leave Closures board: its bank holidays (and a Jeff Day once it has a date),
// then its company close days, one line each (Fri 24, Wed 29, Thu 30 and Fri 31 Dec 2027), so they're never mistaken for
// the bank holidays between them. Each year lists only its own dates: the January days after Christmas 2027 are under 2028.
function closedInHtml(year) {
  const types = state.data.closureTypes, names = state.data.bankHolidays;
  const all = [...types.keys()].sort();
  const kind = (d) => { const t = types.get(d) || ''; return isCloseDay(t) ? 'shut' : /jeff/i.test(t) ? 'jeff' : 'bh'; };
  const day = (d) => fmtDate(d, yearOf(d) !== year);
  const bare = bareName;   // "Good Friday 2027" → "Good Friday"
  const row = (cl, when, what) => (what === null
    ? `<li class="wide"><i class="sw closed-${cl}" aria-hidden="true"></i><span class="cl-when">${esc(when)}</span></li>`
    : `<li><i class="sw closed-${cl}" aria-hidden="true"></i><span class="cl-when">${esc(when)}</span><span class="cl-what">${esc(what)}</span></li>`);
  const bank = all.filter((d) => yearOf(d) === year && kind(d) === 'bh').map((d) => row('bh', day(d), bare(names.get(d)) || 'Bank holiday'));
  const jeff = all.filter((d) => yearOf(d) === year && kind(d) === 'jeff').map((d) => row('jeff', day(d), 'Jeff Day'));
  const closeDays = all.filter((d) => yearOf(d) === year && kind(d) === 'shut');
  const shut = closeDays.map((d) => row('shut', day(d), null));
  if (!closeDays.some((d) => d.slice(5, 7) === '12')) shut.push(row('shut', 'December', 'Dates to follow'));
  const list = (h, rows) => rows.length ? `<div><h3>${h}</h3><ul class="cl-list">${rows.join('')}</ul></div>` : '';
  return `<div class="mine-closed">${list(`Bank holidays in ${year}`, bank)}${list('Jeff Day', jeff)}${list(`Company close days in ${year}`, shut)}</div>`;
}
// The leave years there are to look at: from the first on this tracker to next year.
function leaveYears() {
  const years = [];
  for (let y = FIRST_LEAVE_YEAR; y <= state.ctx.currentYear + 1; y++) years.push(y);
  return years;
}
const shownYear = (years) => (years.includes(recordYear) ? recordYear : state.ctx.currentYear);
// Days left in a leave year, with every figure the Balances table had, from the same balanceFor(): the allowance less
// the days held back for company close days, plus any carried over, is what's bookable; Accepted and Waiting are the
// working days requested in that year.
function balanceCardHtml(s, year, years, own) {
  const b = balanceFor(state.ctx, s, year);
  const sum = [`${fmtNum(b.allowance)} days’ allowance`];
  if (b.reserved) sum.push(`− ${fmtNum(b.reserved)} for company close days`);
  if (b.carried) sum.push(`+ ${fmtNum(b.carried)} carried over`);
  const unset = !b.allowanceMissing ? '' : own ? 'Your record has no allowance set yet. Ask a leave approver.' : 'No allowance is set on their FLR - Leave Allowances record.';
  return `<section class="card mine-balance" aria-labelledby="mine-h">
      <div class="mb-head"><h2 id="mine-h">Days left in ${year}</h2>
        ${years.length > 1 ? `<fieldset class="seg" id="mine-year"><legend>Leave year</legend>${years.map((y) => `<label><input type="radio" name="mine-year" value="${y}" ${y === year ? 'checked' : ''}>${y === FIRST_LEAVE_YEAR && beforeTracking() ? esc(yearText(y)) : y}</label>`).join('')}</fieldset>` : ''}</div>
      <p class="mb-big"><span class="big num${b.remaining < 0 ? ' neg' : ''}">${fmtNum(b.remaining)}</span><span class="mb-unit">days</span></p>
      <dl class="mb-grid">
        <div><dt>Bookable</dt><dd class="num">${fmtNum(b.entitlement)}</dd></div>
        <div><dt>Accepted</dt><dd class="num">${fmtNum(b.booked)}</dd></div>
        <div><dt>Waiting for a decision</dt><dd class="num">${fmtNum(b.pending)}</dd></div>
        <div><dt>Left if accepted</dt><dd class="num${b.remainingIfPending < 0 ? ' neg' : ''}">${fmtNum(b.remainingIfPending)}</dd></div>
      </dl>
      <p class="subtle">${esc(sum.join(' '))} = ${fmtNum(b.entitlement)} bookable. Bank holidays and the Jeff Day are on top.</p>${unset ? `
      <p class="subtle neg">${esc(unset)}</p>` : ''}
    </section>`;
}
// A request on a person's record: its first day, its dates, its working days and the decision, as a button that opens the
// request; leave running over New Year says how much falls in the year shown.
function requestRowHtml(r, year) {

      <span class="mr-status">${pillFor(r.decision)}</span>${icon('chev-r', 'ico mr-go')}</button></li>`;

// "Your requests in 2027": going ahead, waiting and not going ahead (which folds away), then any from before tracking

/* ---------- A person's leave record: leave approvers open it from a name in the Diary ---------- */
// My Leave's layout for anyone on FLR - Leave Allowances, one leave year at a time: their days left, the days FLR is
// closed, their annual leave requests (each opens the request) and their other leave. It replaced the Balances table,
// so its figures are that table's: balanceFor() above, and otherTotalsFor() for other leave. My Leave has the same
// other leave section: staff receive their own other leave from the FLR server, and nobody else's.
function otherLeaveOf(s, year) {
  const ctx = state.ctx, first = `${year}-01-01`, last = `${year}-12-31`;
  return ctx.otherLeave.filter((e) => {
    const owner = ctx.otherStaffOf(e), d = ctx.otherDaysOf(e);
    return owner && String(owner.id) === String(s.id) && d.from && d.from <= last && d.to >= first;
  }).sort((x, z) => ctx.otherDaysOf(z).from.localeCompare(ctx.otherDaysOf(x).from));
}
// Other leave (sick, unpaid, study and the rest) is recorded rather than requested, so it has no decision: its status is
// whether it's been taken. None of it comes out of annual leave.
function otherRowHtml(e, year) {
  const d = state.ctx.otherDaysOf(e), now = state.ctx.today;
  const half = d.days.length === 1 && d.days[0].amount === 0.5;
  const bits = [half ? `½ day, ${e.halfDay === 'pm' ? 'afternoon' : 'morning'}` : plural(d.total, 'working day')];
  if (!half && (d.byYear[year] || 0) !== d.total) bits.push(`${fmtNum(d.byYear[year] || 0)} in ${year}`);   // runs over New Year
  bits.push('not taken from annual leave');
  const [tone, status] = d.to < now ? ['grey', 'Taken'] : d.from > now ? ['new', 'Upcoming'] : ['ok', 'On now'];
  return `<li class="mine-row">
      <div class="ag-date"><b>${Number(d.from.slice(8))}</b><small>${MON[Number(d.from.slice(5, 7)) - 1]}</small></div>
      <div class="mr-main"><p class="mr-dates">${esc(fmtRange(d.from, d.to))}</p>
        <p class="subtle"><span class="ol-type"><i class="sw" style="background:${OTHER_TYPE_COLOURS[e.type] || '#c4c4c4'}" aria-hidden="true"></i>${esc(e.type)}</span> · ${esc(bits.join(' · '))}</p></div>
      <div class="mr-status"><span class="pill ${tone}">${status}</span></div></li>`;
}
// The section on a person's record and on My Leave: the year's other leave by type (the Balances table's "Other leave"
// column, from otherTotalsFor()), then each entry.
function otherLeaveHtml(s, year, own) {
  const totals = otherTotalsFor(state.ctx, s, year), other = otherLeaveOf(s, year);
  const days = Object.values(totals).reduce((a, n) => a + n, 0);
  const byType = Object.entries(totals).sort((x, z) => z[1] - x[1] || x[0].localeCompare(z[0])).map(([t, n]) => `${t} ${fmtNum(n)}`).join(', ');
  return `<section aria-labelledby="other-h">
      <h2 class="mine-sect" id="other-h">Other leave in ${year}</h2>
      <p class="sect-sum">${days ? `<b>${esc(lvDays(days))}</b>: ${esc(byType)}. ` : ''}Other leave isn’t taken from annual leave, so it doesn’t change ${own ? 'your' : 'the'} days left.</p>
      ${other.length ? `<ul class="mine-rows">${other.map((e) => otherRowHtml(e, year)).join('')}</ul>` : `<p class="mine-none">No other leave in ${year}.</p>`}
    </section>`;
}
function renderRecord(s) {
  const ctx = state.ctx, years = leaveYears(), year = shownYear(years);
  const groups = ctx.groupsOf(s).filter(Boolean).map((g) => g.name).sort();
  const where = groups.length ? groups.join(', ') : 'No leave group';

    const owner = ctx.staffOf(r);
    return owner && String(owner.id) === String(s.id) && inLeaveYear(ctx.daysOf(r), year);   // the year rule My Leave uses too
  }).sort((x, z) => (ctx.daysOf(z).from || '').localeCompare(ctx.daysOf(x).from || ''));
  return `<div class="mine record">
    <div class="mine-top">

/* ---------- Request sheet + confirmation ---------- */

/* ---------- Check dates: how many working days a request would use, before it's sent ---------- */

      : `<div class="decide-row">
          ${r.decision === 'accepted' ? `<button class="btn deny lg" type="button" data-act="decide" data-id="${esc(r.id)}" data-action="Cancelled" ${anyBusy ? 'disabled' : ''}>Cancel leave</button>` : ''}
          <button class="btn lg" type="button" data-act="decide" data-id="${esc(r.id)}" data-action="New request" ${anyBusy ? 'disabled' : ''}>Re-open</button>
        </div>`;
    sheetUI.show(`<header class="dlg-head">
        <div class="ch-who">${avatar(name, sid)}<div><h2 id="sheet-title">${esc(name)}</h2><p class="subtle">${esc(fmtRange(d.from, d.to))}</p></div></div>
        <button class="close" type="button" data-act="close" aria-label="Close details">${icon('close')}</button>
      </header>
      <div class="dlg-body">
        <div class="decide-row">${pillFor(r.decision)}${ev ? suggestPill(ev.suggested) : ''}</div>
        ${ev ? `<p class="subtle">${esc(screenReason(ev.reason))}</p>` : ''}
        <div class="statlist">
          <div class="stat"><span>Working days</span><b class="num">${fmtNum(d.total)}</b></div>
          ${ev && ev.leftAfter !== null ? `<div class="stat"><span>Left after this</span><b class="num">${fmtNum(ev.leftAfter)}</b></div>` : ''}
          <div class="stat"><span>Leave group</span><b>${esc((ev && ev.groupNames) || r.cur.leaveGroup || '—')}</b></div>
          ${sid && !staffView() && String(sid) !== state.person ? `<button class="stat go" type="button" data-act="person" data-id="${esc(sid)}"><span>Leave record</span><b>Days left and all leave${icon('chev-r')}</b></button>` : ''}
          ${requestTimes(r).map(([k, v, by]) => `<div class="stat"><span>${esc(k)}</span><b>${whenHtml(v, by)}</b></div>`).join('')}
          ${r.email ? `<div class="stat"><span>Email</span><b class="formlink">${esc(r.email)}</b></div>` : ''}
        </div>
        ${r.notes ? `<section class="panel-block"><h3 class="eyebrow">Employee notes</h3><p class="note-text">${esc(r.notes)}</p></section>` : ''}
        ${r.cur.managersNote ? `<section class="panel-block"><h3 class="eyebrow">Manager's note</h3><p class="note-text">${esc(r.cur.managersNote)}</p></section>` : ''}
        <section class="panel-block"><h3 class="eyebrow">Check details</h3><pre class="details">${esc(details)}</pre></section>
      </div>
      <footer class="dlg-foot">${actions}</footer>`, r.id);
  } else sheetUI.hide();
  if (state.confirm) {
    const c = state.confirm;
    alertUI.show(`<div class="alert-text"><h2 id="cf-title">${esc(c.title)}</h2><p id="cf-body">${esc(c.body)}</p></div>
      <div class="alert-btns"><button type="button" data-act="confirm-no" data-focus>${esc(c.no)}</button><button type="button" class="${c.tone === 'deny' ? 'danger' : 'go'}" data-act="confirm-yes">${esc(c.yes)}</button></div>`);
  } else alertUI.hide();
}

/* ---------------------------------------------------------------------
   Events
   --------------------------------------------------------------------- */
function requestDecision(id, action) {
  const r = state.data.requests.find((x) => x.id === id);
  if (!r) return;
  if (action === 'Accepted' && isPending(r)) {
    const ev = evaluate(r);
    if (ev.suggested !== 'Accept') {
      state.confirm = { title: 'Accept anyway?', body: `The checks suggest ${ev.suggested}: ${screenReason(ev.reason)}.`, yes: 'Accept anyway', no: 'Go back', tone: 'accept', run: () => decide(id, 'Accepted') };
      renderOverlay();
      return;
    }
  }
  if (action === 'Cancelled') {
    state.confirm = { title: 'Cancel this leave?', body: `${displayName(r)}'s leave will be marked as cancelled and the days go back into their allowance.`, yes: 'Cancel leave', no: 'Keep the leave', tone: 'deny', run: () => decide(id, 'Cancelled') };
    renderOverlay();
    return;
  }
  decide(id, action);
}
/* ---------- Opening and closing a person's record ---------- */
// The record shows in place of the tab it was opened from, which stays selected. "‹ Diary" above the name, that tab
// or the browser's Back goes back to it as it was left (same place, same name selected). The record has its own address,
// #person-<record id>, so Back and Forward work and a record can be linked to. Only approvers ever see one: the FLR
// server sends staff nobody's leave but their own, and the page turns the address away from them too.
const PERSON_HASH = /^#person-(\d+)$/;
let recordFrom = null;   // the page it was opened from: how far down it was, and which of its names was selected
let addressRead = false;
const PAGE_LOAD = Math.random().toString(36).slice(2);   // a step made before a reload belongs to the page that was reloaded
try { history.scrollRestoration = 'manual'; } catch (e) { /* the page puts the scroll back itself */ }
function setAddress(id) {   // a record's address as a new step in the history, or no record (this step rewritten)
  try {
    if (id) history.pushState({ flrPerson: id, load: PAGE_LOAD }, '', `#person-${id}`);
    else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  } catch (e) { /* no history to use (the Claude preview): the record still opens and closes */ }
}
const ownStep = () => Boolean(history.state && state.person && history.state.flrPerson === state.person && history.state.load === PAGE_LOAD);
// The person whose record is open, while it can be: for approvers, and while they're on FLR - Leave Allowances.
function recordPerson() {
  if (!state.person || !state.data) return null;
  const s = staffView() ? null : state.ctx.staffById.get(state.person);
  if (!s) { state.person = null; recordFrom = null; setAddress(null); }
  return s || null;
}
function setBack(label) {
  const back = document.getElementById('lt-back');
  back.hidden = !label;
  document.getElementById('lt-eyebrow').hidden = Boolean(label);
  if (label) { document.getElementById('lt-back-label').textContent = label; back.setAttribute('aria-label', `Back to ${label}`); }
}
function openPerson(id, { opener = null, step = true } = {}) {
  id = String(id);
  if (staffView() || !state.data || !state.ctx.staffById.has(id) || state.person === id) return;
  if (!state.person) {
    const names = [...document.querySelectorAll('#view [data-act="person"]')];
    recordFrom = { scroll: window.scrollY, at: names.indexOf(opener) };
  }
  state.person = id;
  if (step) setAddress(id);
  renderChrome(); renderView();
  window.scrollTo(0, 0);
  focusTitle();
  FLRUI.slideIn(document.getElementById('view'), 1);   // in from the right, as a page opened from a list
  if (chrome) chrome.update();
}
// Back to the tab underneath. When the record was a step in the history, the history steps back too (so a later Back
// leaves the page, as it would have), but the page goes back straight away, so a second tap can't go any further.
function closePerson() {
  if (!state.person) return;
  const own = ownStep();
  showUnderneath();
  if (own) history.back(); else setAddress(null);
}
function dropPerson() {   // the record closes without drawing the tab underneath (another tab is about to show)
  const own = ownStep();
  state.person = null; recordFrom = null;
  if (own) history.back(); else setAddress(null);
}
function showUnderneath() {
  const from = recordFrom, id = state.person;
  state.person = null; recordFrom = null;
  renderChrome(); renderView();
  window.scrollTo(0, from ? from.scroll : 0);
  const names = from ? [...document.querySelectorAll('#view [data-act="person"]')] : [];
  const back = (names[from && from.at] && names[from.at].dataset.id === id && names[from.at]) || names.find((n) => n.dataset.id === id);
  if (back) back.focus({ preventScroll: true }); else focusTitle();
  FLRUI.slideIn(document.getElementById('view'), -1);
  if (chrome) chrome.update();
}
// A record's address, once the leave has loaded (only then is it known whether this is an approver): from a link or a
// reload, and from Back and Forward. Staff are shown their own My Leave instead.
function readAddress() {
  const m = PERSON_HASH.exec(location.hash);
  if (!m) { if (state.person) showUnderneath(); return; }
  if (staffView()) {
    setAddress(null);
    const me = state.data.staff[0];
    if (!me || String(me.id) !== m[1]) showToast('You can only see your own leave.');
    if (state.tab !== 'mine') goTab('mine');
    return;
  }
  if (m[1] === state.person) return;
  if (!state.ctx.staffById.has(m[1])) { setAddress(null); showToast('That leave record isn’t on FLR - Leave Allowances.'); return; }
  const link = !state.person && !addressRead;
  if (link) state.tab = 'diary';   // opened from a link: its way back is the Diary, from the top
  openPerson(m[1], { step: false });
  if (link) recordFrom = null;
}
addEventListener('popstate', () => { if (state.data) readAddress(); });

// Tabs keep their own scroll position; tapping the current tab again scrolls it to the top, as on iPhone.
function goTab(id) {
  if (!TABS.some((t) => t.id === id)) return;
  if (state.person && id === state.tab) { closePerson(); return; }   // the record's own tab takes it back there
  if (id === state.tab) { window.scrollTo({ top: 0, behavior: FLRUI.reduced() ? 'auto' : 'smooth' }); return; }
  if (state.person) {
    // Another tab while a record is open: the record goes, and its place in the browser's history with it.
    scrollByTab[state.tab] = recordFrom ? recordFrom.scroll : 0;
    dropPerson();
  } else scrollByTab[state.tab] = window.scrollY;
  state.tab = id;
  try { localStorage.setItem('flr-leave-tab', id); } catch (e) { /* storage unavailable */ }
  renderChrome(); renderView();
  window.scrollTo(0, scrollByTab[id] || 0);
  FLRUI.fadeIn(document.getElementById('view'));
  if (chrome) chrome.update();
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'tab': goTab(id); break;
    case 'refresh': load(); break;
    case 'key-bar': keyOpen = !(keyOpen && isDocked()); applyKey(true); break;
    case 'key-hide': keyOpen = false; applyKey(true); document.getElementById('nb-key').focus(); break;
    case 'copy-form': {
      try { await navigator.clipboard.writeText(FORM_URL); showToast(`Form link copied: ${FORM_URL}`); }
      catch (e) { showToast(`Copy this link: ${FORM_URL}`); }
      break;
    }
    case 'open': state.panel = id; renderOverlay(); break;
    case 'check-dates': state.panel = CHECK; renderOverlay(); break;
    case 'person':
      if (state.panel) { state.panel = null; renderOverlay(); }   // from the request sheet: it goes down as the record opens
      openPerson(id, { opener: el });
      break;
    case 'person-back': closePerson(); break;
    case 'close': state.panel = null; renderOverlay(); break;
    case 'decide': requestDecision(id, el.dataset.action); break;
    case 'confirm-yes': { const run = state.confirm && state.confirm.run; state.confirm = null; renderOverlay(); if (run) run(); break; }
    case 'confirm-no': state.confirm = null; renderOverlay(); break;
    case 'month': {
      const st = state.diary, before = st.y * 12 + st.m, step = st.mode === 'list' ? 12 : 1;   // the Leave List shows a year
      if (id === '0') { st.y = startMonth.y; st.m = startMonth.m; }
      else {
        const t = st.y * 12 + st.m + Number(id) * step;
        if (Math.floor(t / 12) < FIRST_LEAVE_YEAR) break;   // nothing before tracking starts is tracked
        st.y = Math.floor(t / 12); st.m = t % 12;
      }
      renderDiaryBody();
      FLRUI.slideIn(document.getElementById('diary-body'), Math.sign(st.y * 12 + st.m - before));
      break;
    }
    default: break;
  }
});
document.getElementById('tabs').addEventListener('keydown', (ev) => {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) return;
  const list = [...document.querySelectorAll('#tabs .tab:not([hidden])')];
  const i = list.findIndex((t) => t.dataset.id === state.tab);
  const j = ev.key === 'Home' ? 0 : ev.key === 'End' ? list.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : list.length - 1)) % list.length;
  ev.preventDefault();
  goTab(list[j].dataset.id);
  list[j].focus();
});
// The colour key pulls down from its button and goes back into it. It can be caught mid-way: each move starts from
// where the panel is now. A tap outside it or Escape puts it away.
function keyDrop(det, want, focus = false) {
  const sum = det.querySelector('summary'), pop = det.querySelector('.key-pop');
  let from = null;
  if (det._anim) { const cs = getComputedStyle(pop); from = { opacity: cs.opacity, transform: cs.transform }; det._anim.onfinish = null; det._anim.cancel(); det._anim = null; }
  const motion = !FLRUI.reduced() && pop.animate;
  if (want) {
    det.classList.remove('closing');
    det.open = true;
    const b = sum.getBoundingClientRect(), p = pop.getBoundingClientRect();
    pop.style.transformOrigin = `${Math.round(b.left + b.width / 2 - p.left)}px -8px`;   // it grows out of the button
    if (motion) det._anim = pop.animate([from || { opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'cubic-bezier(.2,1,.4,1)' });
    return;
  }
  if (!det.open) return;
  const done = () => { det.open = false; det.classList.remove('closing'); if (det._anim) { det._anim.cancel(); det._anim = null; } if (focus) sum.focus(); };
  if (!motion) { done(); return; }
  det.classList.add('closing');
  det._anim = pop.animate([from || { opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.95)' }], { duration: 170, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
  det._anim.onfinish = done;   // closes first, then drops the held fade so the next opening starts clean
}
// The key is open or not wherever it is on screen: as the dropdown under its button, or, once that button has scrolled
// up under the navigation bar, as the strip along the bottom of the bar, so it comes along while the page scrolls.
let keyOpen = false;
document.addEventListener('click', (ev) => {
  const sum = ev.target.closest('.keydrop > summary');
  if (!sum) return;
  ev.preventDefault();
  const det = sum.parentElement, want = !det.open || det.classList.contains('closing');
  if (det.id === 'diary-key') keyOpen = want;
  keyDrop(det, want);
});
document.addEventListener('pointerdown', (ev) => {
  // A tap elsewhere puts the dropdown away. The strip stays: it's there to compare with while working in the page.
  for (const det of document.querySelectorAll('.keydrop[open]:not(.closing)')) {
    if (det.contains(ev.target)) continue;
    if (det.id === 'diary-key') keyOpen = false;
    keyDrop(det, false);
  }
}, true);
let keyWatch = null;
const isDocked = () => document.documentElement.classList.contains('key-docked');
// Shows the open key in the right place. When the page moves it between its button and the bar, the dropdown opens or
// closes at once (its button has just gone, or is only just coming back) and the strip glides in.
function applyKey(animate = false) {
  const docked = isDocked(), det = document.getElementById('diary-key');
  if (det) {
    const want = keyOpen && !docked, now = det.open && !det.classList.contains('closing');
    if (want !== now) {
      if (animate) keyDrop(det, want);
      else { if (det._anim) { det._anim.onfinish = null; det._anim.cancel(); det._anim = null; } det.classList.remove('closing'); det.open = want; }
    }
  }
  const strip = document.getElementById('key-strip'), show = keyOpen && docked;
  if (strip.hidden === show) { strip.hidden = !show; strip.classList.toggle('arrive', show); }
  document.getElementById('nb-key').setAttribute('aria-expanded', String(show));
  if (chrome) chrome.update();
}
function dockKey(on) {
  if (isDocked() === on) return;
  document.documentElement.classList.toggle('key-docked', on);
  applyKey(false);
}
function watchDiaryKey() {
  if (keyWatch) { keyWatch.disconnect(); keyWatch = null; }
  const sum = state.tab === 'diary' && !staffView() ? document.querySelector('#diary-key > summary') : null;
  if (!sum) { keyOpen = false; document.documentElement.classList.remove('key-docked'); applyKey(false); return; }
  // Measured from the bar's own row, so the strip showing or not doesn't move the line.
  const barBottom = Math.round(document.querySelector('.nb-row').getBoundingClientRect().bottom);
  document.documentElement.classList.toggle('key-docked', sum.getBoundingClientRect().bottom <= barBottom);
  applyKey(false);
  if (!('IntersectionObserver' in window)) return;
  keyWatch = new IntersectionObserver(([e]) => dockKey(!e.isIntersecting && e.boundingClientRect.top < barBottom), { rootMargin: `-${barBottom}px 0px 0px 0px` });
  keyWatch.observe(sum);
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !state.confirm && !state.panel) {
    const openKey = document.querySelector('.keydrop[open]:not(.closing)');
    if (openKey) { if (openKey.id === 'diary-key') keyOpen = false; keyDrop(openKey, false, openKey.contains(document.activeElement)); return; }
    if (keyOpen && isDocked()) {
      const inStrip = document.getElementById('key-strip').contains(document.activeElement);
      keyOpen = false; applyKey(true);
      if (inStrip) document.getElementById('nb-key').focus();
      return;
    }
  }
  if (ev.key === 'Escape') {
    if (state.confirm) { state.confirm = null; renderOverlay(); }
    else if (state.panel) { state.panel = null; renderOverlay(); }
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr.click')) {
    ev.preventDefault();
    state.panel = ev.target.dataset.id;
    renderOverlay();
  }
});
// Check dates: the whole row opens the date picker, where the browser can be asked to.
document.addEventListener('click', (ev) => {
  const t = ev.target;
  if (t && t.matches && t.matches('input.cd-in') && typeof t.showPicker === 'function') { try { t.showPicker(); } catch (e) { /* the browser opens its own */ } }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.note) { state.notes[t.dataset.note] = t.value; return; }
  if (t.id === 'cd-from' || t.id === 'cd-to') { checkDatesInput(t); return; }
  if (t.id === 'diary-search') { state.diary.search = t.value; renderDiaryBody(); }
  if (t.id === 'all-search') { state.all.search = t.value; renderRequestsBody(); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.name === 'diary-mode') { state.diary.mode = t.value; renderDiaryBody(); FLRUI.fadeIn(document.getElementById('diary-body')); return; }
  if (t.name === 'mine-year') {
    recordYear = Number(t.value); renderView();
    const on = document.querySelector('#mine-year input:checked');   // keyboard users stay on the switch
    if (on) on.focus({ preventScroll: true });
    return;
  }
  switch (t.id) {
    case 'diary-group': state.diary.group = t.value; renderDiaryBody(); break;
    case 'diary-pending': state.diary.pending = t.checked; renderDiaryBody(); break;
    case 'diary-other': state.diary.other = t.checked; renderDiaryBody(); break;
    case 'all-decision': state.all.decision = t.value; renderRequestsBody(); break;
    case 'all-year': state.all.year = t.value; renderRequestsBody(); break;
    default: break;
  }
});

/* ---------------------------------------------------------------------
   Start
   --------------------------------------------------------------------- */
document.getElementById('ks-scroll').innerHTML = colourKeyStripHtml();
renderChrome();
tabsCtl = FLRUI.initTabs(document.getElementById('tabs'), (el) => goTab(el.dataset.id));
chrome = FLRUI.initChrome(document.getElementById('navbar'), () => document.getElementById('lt-title'));
renderView();
(async () => {
  let mcp = null;
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch (e) { mcp = null; }
  state.mcp = mcp;
  if (!mcp) { state.loading = false; renderAll(); return; }
  load();
})();
</script>
