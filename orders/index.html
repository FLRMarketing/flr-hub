<header class="bar" id="bar">
  <div class="wrap bar-inner">
    <a class="back" href="../" id="back"><svg aria-hidden="true"><use href="#i-back"/></svg><span id="back-label">Hub</span></a>
    <p class="bar-title" id="bar-title" aria-hidden="true">Order Tracker</p>
    <span class="bar-end"><button class="iconbtn" type="button" id="refresh" aria-label="Check for updates now" title="Check for updates now" hidden><svg aria-hidden="true"><use href="#i-refresh"/></svg></button></span>
  </div>
</header>

<main class="wrap ord" id="main" tabindex="-1">
  <div class="gate" id="gate" role="status" aria-live="polite">
    <div class="gate-loading" id="gate-loading" aria-label="Loading orders"><span class="skeleton-line"></span><span class="skeleton-line short"></span><span class="skeleton-block"></span><span class="skeleton-block"></span></div>
    <div class="gate-message" id="gate-message" hidden>
      <h2 class="gate-title" id="gate-title"></h2>
      <p class="gate-text" id="gate-text"></p>
      <p class="gate-actions"><a class="btn btn-primary" id="gate-home" href="../">Back to the Hub</a><button class="btn btn-plain" type="button" id="gate-retry" hidden>Try again</button></p>
    </div>
  </div>
  <div id="view" hidden></div>
</main>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
<noscript><p class="noscript">The Order Tracker needs JavaScript switched on.</p></noscript>
</body>
</html>
