<header class="bar" id="bar">
  <div class="wrap bar-inner">
    <a class="back" href="../" id="back"><svg aria-hidden="true"><use href="#i-back"/></svg><span id="back-label">Hub</span></a>
    <p class="bar-title" id="bar-title" aria-hidden="true">Onboarding</p>
    <span class="bar-end" id="bar-end"></span>
  </div>
</header>

<main class="wrap onb" id="main" tabindex="-1">
  <div class="gate" id="gate" role="status" aria-live="polite">
    <div class="gate-loading" id="gate-loading"><span class="skeleton-line"></span><span class="skeleton-line short"></span><span class="skeleton-block"></span></div>
    <div class="gate-message" id="gate-message" hidden>
      <h2 class="gate-title" id="gate-title"></h2>
      <p class="gate-text" id="gate-text"></p>
      <p class="gate-actions"><a class="btn btn-primary" id="gate-home" href="../">Back to the Hub</a><button class="btn btn-plain" type="button" id="gate-retry" hidden>Try again</button></p>
    </div>
  </div>
  <div id="view" hidden></div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="scrim" data-close></div>
  <div class="panel" role="document">
    <div class="sheet-head"><span class="grabber" aria-hidden="true"></span><h2 class="sheet-title" id="sheet-title"></h2>
      <button class="close" type="button" data-close aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
<noscript><p class="noscript">Onboarding needs JavaScript switched on.</p></noscript>
</body>
